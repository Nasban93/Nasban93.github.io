<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGT 672 — International Management Study Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
  --bg: #151210;
  --card: #1a1714;
  --card2: #1e1b16;
  --border: #2a2520;
  --border2: #3d352e;
  --gold: #c49b63;
  --gold2: #8b6914;
  --text: #c4b5a0;
  --text2: #e8d5b7;
  --text3: #7a7068;
  --text4: #5a5048;
  --gbg: #1e2e1e;
  --gbd: #4caf50;
  --rbg: #2e1e1e;
  --rbd: #e53935;
}

.light {
  --bg: #faf7f2;
  --card: #fff;
  --card2: #f5f0eb;
  --border: #e8e0d5;
  --border2: #e0d5c8;
  --text: #333;
  --text2: #1a1a2e;
  --text3: #999;
  --text4: #aaa;
  --gbg: #e8f5e9;
  --rbg: #ffebee;
}
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
    transition: 0.3s;
  }

  /* ── HEADER ── */
  .header {
    padding: 28px 40px 0;
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold2);
    letter-spacing: -0.5px;
  }
  .header-sub {
    font-size: 12px;
    color: var(--text3);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .nav-btn {
    display: inline-flex;
    align-items: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    transition: all 0.15s;
  }
  .nav-btn:hover {
    border-color: var(--border2);
    color: var(--gold);
  }
  
  .theme-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }

  .header-badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gold-dim);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 4px 10px;
    letter-spacing: 0.05em;
  }

  /* ── TABS ── */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-top: 0;
  }
  .tab-btn {
    padding: 12px 22px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active {
    color: var(--gold2);
    border-bottom: 2px solid var(--gold);
  }
  .tab-icon { margin-right: 6px; opacity: 0.7; }

  /* ── MAIN LAYOUT ── */
  .main {
    display: flex;
    min-height: calc(100vh - 115px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    min-width: 220px;
    border-right: 1px solid var(--border);
    padding: 20px 0;
    background: var(--bg2);
    position: sticky;
    top: 0;
    height: calc(100vh - 115px);
    overflow-y: auto;
    display: none;
  }
  .sidebar.visible { display: block; }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 18px 8px;
  }
  .sidebar-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 18px;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .sidebar-btn:hover { color: var(--text); background: var(--bg3); }
  .sidebar-btn.active {
    color: var(--gold2);
    border-left-color: var(--gold);
    background: var(--bg3);
    font-weight: 500;
  }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    padding: 28px 36px;
    overflow-y: auto;
    max-height: calc(100vh - 115px);
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── ACCORDION (Summary) ── */
  .chapter-block { margin-bottom: 10px; }
  .chapter-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 18px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .chapter-header:hover { background: var(--bg4); border-color: var(--border2); }
  .chapter-header.open {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-color: var(--gold-dim);
  }
  .chapter-header-left { display: flex; align-items: center; gap: 12px; }
  .ch-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gold-dim);
    font-weight: 500;
    letter-spacing: 0.05em;
    min-width: 36px;
  }
  .ch-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .ch-arrow {
    color: var(--text3);
    font-size: 11px;
    transition: transform 0.25s;
  }
  .chapter-header.open .ch-arrow { transform: rotate(180deg); }

  .chapter-body {
    display: none;
    border: 1px solid var(--gold-dim);
    border-top: none;
    border-bottom-left-radius: var(--radius);
    border-bottom-right-radius: var(--radius);
    background: var(--bg2);
    overflow: hidden;
  }
  .chapter-body.open { display: block; }

  .section-tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    background: var(--bg3);
  }
  .section-tab {
    padding: 10px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .section-tab:hover { color: var(--text2); }
  .section-tab.active { color: var(--gold2); border-bottom-color: var(--gold); }

  .section-pane { display: none; padding: 20px 22px; }
  .section-pane.active { display: block; }

  .section-pane h3 {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--gold2);
    margin: 18px 0 8px;
  }
  .section-pane h3:first-child { margin-top: 0; }
  .section-pane p { color: var(--text2); font-size: 13px; margin-bottom: 10px; line-height: 1.75; }
  .section-pane ul { padding-left: 18px; color: var(--text2); font-size: 13px; }
  .section-pane li { margin-bottom: 5px; line-height: 1.7; }
  .section-pane b { color: var(--text); font-weight: 500; }
  .section-pane i { color: var(--text3); font-style: italic; }

  .imp-badge {
    display: inline-block;
    background: #1f1800;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 3px;
    margin-right: 6px;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 0;
  }
  .compare-cell {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text2);
  }
  .compare-cell .cell-head {
    font-size: 11px;
    font-weight: 600;
    color: var(--gold-dim);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .strat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin: 10px 0;
  }
  .strat-table th {
    background: var(--bg4);
    color: var(--gold-dim);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border2);
  }
  .strat-table td {
    padding: 8px 12px;
    color: var(--text2);
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .strat-table tr:last-child td { border-bottom: none; }
  .strat-table tr:hover td { background: var(--bg3); }

  /* ── QUIZ ── */
  .quiz-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active {
    background: #1f1800;
    border-color: var(--gold-dim);
    color: var(--gold2);
  }

  .score-strip {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    margin-bottom: 20px;
  }
  .score-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; }
  .score-val { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--gold2); min-width: 60px; }
  .score-pct { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
  .prog-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .reset-btn {
    padding: 5px 12px;
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red-text); }

  .quiz-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .quiz-card.answered-right { border-color: var(--green); }
  .quiz-card.answered-wrong { border-color: var(--red); }
  .quiz-card.answered-right .q-num-tag { background: var(--green-bg); color: var(--green-text); }
  .quiz-card.answered-wrong .q-num-tag { background: var(--red-bg); color: var(--red-text); }

  .q-num-tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: var(--bg4);
    color: var(--text3);
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .q-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .opt-list { display: flex; flex-direction: column; gap: 6px; }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    cursor: pointer;
    transition: all 0.12s;
  }
  .opt-btn:hover:not(:disabled) { background: var(--bg4); border-color: var(--border2); color: var(--text); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green-text);
  }
  .opt-btn.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red-text);
  }
  .opt-letter {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    margin-right: 8px;
    opacity: 0.6;
  }

  .feedback-strip {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.6;
    display: none;
  }
  .feedback-strip.correct-fb { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green); }
  .feedback-strip.wrong-fb { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red); }
  .fb-icon { font-weight: 600; margin-right: 4px; }

  /* ── ESSAY ── */
  .essay-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    margin-bottom: 14px;
  }
  .essay-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--gold-dim);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .essay-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--gold2);
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .essay-section-head {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 14px 0 6px;
  }
  .essay-section-head:first-child { margin-top: 0; }
  .essay-body { font-size: 13px; color: var(--text2); line-height: 1.8; }
  .essay-body b { color: var(--text); font-weight: 500; }
  .essay-body .point {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }
  .essay-body .point-dot {
    color: var(--gold-dim);
    font-size: 16px;
    line-height: 1.5;
    flex-shrink: 0;
  }
  .example-box {
    background: var(--bg4);
    border-left: 3px solid var(--gold-dim);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text3);
  }
  .example-box .ex-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--gold-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .header { padding: 20px 18px 0; }
    .content { padding: 20px 16px; }
    .compare-grid { grid-template-columns: 1fr; }
    .header-title { font-size: 22px; }
  }
</style>
</head>
<body class="light">

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-sub">FINAL EXAM</div>
      <div class="header-title">MGT 672 — International Management</div>
    </div>
    <div class="header-actions">
      <div class="header-badge">FINAL EXAM PREP</div>
      <a href="index.html" class="nav-btn">🏠 Main </a>
      <button onclick="toggleTheme()" class="theme-btn" id="themeBtn">☀️</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('summary')"><span class="tab-icon">📖</span>Wael's Summary</button>
    <button class="tab-btn" onclick="switchTab('prevmcq')"><span class="tab-icon">📋</span>Musaad - Previous Midterm Exams</button>
    <button class="tab-btn" onclick="switchTab('chmcq')"><span class="tab-icon">🧠</span>MCQs Ch 8–14</button>
    <button class="tab-btn" onclick="switchTab('essay')"><span class="tab-icon">✍️</span>Essay Guide</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">

    <div class="tab-pane active" id="pane-summary">
      <div id="summary-root"></div>
    </div>

    <div class="tab-pane" id="pane-prevmcq">
      <div class="score-strip">
        <div><div class="score-label">Score</div><div class="score-val" id="p-score">0 / 0</div></div>
        <div class="score-pct" id="p-pct">—</div>
        <div class="prog-track"><div class="prog-fill" id="p-prog"></div></div>
        <button class="reset-btn" onclick="resetQuiz('p')">↺ Reset</button>
      </div>

    <div class="tab-pane" id="pane-chmcq">
      <div class="quiz-toolbar" id="ch-filter-bar"></div>

        <div class="prog-track"><div class="prog-fill" id="c-prog"></div></div>
        <button class="reset-btn" onclick="resetQuiz('c')">↺ Reset</button>
      </div>
      <div id="ch-quiz-root"></div>
    </div>

    <div class="tab-pane" id="pane-essay">
      <div id="essay-root"></div>
    </div>

  </div>
</div>

<script>
// ══════════════════════════════════════
// THEME TOGGLE
// ══════════════════════════════════════
let isLightMode = false;
function toggleTheme() {
  isLightMode = !isLightMode;
  document.body.classList.toggle('light', isLightMode);
  document.getElementById('themeBtn').textContent = isLightMode ? '🌙' : '☀️';
}

// ══════════════════════════════════════
// DATA — SUMMARY
// ══════════════════════════════════════
const SUMMARY = [
  {
    num: 'CH 08', title: 'Strategy Formulation and Implementation',
    sections: [
      {
        name: 'Overview',
        content: `<p><b>Strategic management</b> = determining an organization's basic mission + long-term objectives + implementing a plan of action. MNCs must balance <b>Global Integration</b> (homogenous product/quality worldwide) vs <b>National Responsiveness</b> (adapting to local tastes, standards, and regulations).</p>`
      },
      {
        name: 'Four Imperatives',
        content: `<p><span class="imp-badge">★ HIGH IMPORTANCE</span></p>
        <table class="strat-table">
          <tr><th>Imperative</th><th>Core Logic</th><th>When Used</th></tr>
          <tr><td><b>Economic</b></td><td>Cost leadership, differentiation, segmentation worldwide</td><td>Generic products; value added upstream (R&amp;D, manufacturing)</td></tr>
          <tr><td><b>Political</b></td><td>Country-responsive; protects local market niches</td><td>Value added downstream (marketing, sales, service); multi-domestic strategy</td></tr>
          <tr><td><b>Quality</b></td><td>TQM — cross-training, process reengineering, reward systems</td><td>Quality formulated at top management, diffused throughout org</td></tr>
          <tr><td><b>Admin. Coord.</b></td><td>Decisions based on individual situation merits</td><td>Rapid, flexible decision making needed — <b>LEAST COMMON</b></td></tr>
        </table>`
      },
      {
        name: 'Four Strategies',
        content: `<p><span class="imp-badge">★ MEMORIZE</span> Based on the Integration–Responsiveness (I-R) Grid:</p>
        <table class="strat-table">
          <tr><th>Strategy</th><th>Integration</th><th>Responsiveness</th><th>Key Feature</th></tr>
          <tr><td><b>International</b></td><td>Low</td><td>Low</td><td>Mixed approach; increased standardization</td></tr>
          <tr><td><b>Multi-domestic</b></td><td>Low</td><td>High</td><td>Local adaptation; niche-focused</td></tr>
          <tr><td><b>Global</b></td><td>High</td><td>Low</td><td>Price competition; economies of scale</td></tr>
          <tr><td><b>Transnational</b></td><td>High</td><td>High</td><td>Both integration AND responsiveness</td></tr>
        </table>`
      },
      {
        name: 'Strategy Steps',
        content: `<p>Three steps in formulating strategy:</p>
        <ul>

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['summary','prevmcq','chmcq','essay'][i] === id);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + id).classList.add('active');
  const sb = document.getElementById('sidebar');
  if (id === 'summary') {
    sb.classList.add('visible');
  } else {
    sb.classList.remove('visible');
  }
}

// BUILD SUMMARY
// ══════════════════════════════════════
function buildSummary() {
  const root = document.getElementById('summary-root');
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-label">Chapters</div>';
  sb.classList.add('visible');

  SUMMARY.forEach((ch, ci) => {
    // Sidebar button
    const sbBtn = document.createElement('button');
    sbBtn.className = 'sidebar-btn' + (ci === 0 ? ' active' : '');
    sbBtn.textContent = ch.num + ' — ' + ch.title.split('—')[0].trim();
    sbBtn.style.fontSize = '11px';
    sbBtn.onclick = () => {
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      sbBtn.classList.add('active');
      document.querySelectorAll('.chapter-header').forEach(h => {
        if (h.dataset.ci == ci) {
          if (!h.classList.contains('open')) h.click();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    };
    sb.appendChild(sbBtn);

    // Chapter block
    const block = document.createElement('div');
    block.className = 'chapter-block';

    const header = document.createElement('div');
    header.className = 'chapter-header' + (ci === 0 ? ' open' : '');
    header.dataset.ci = ci;
    header.innerHTML = `
      <div class="chapter-header-left">
        <span class="ch-num">${ch.num}</span>
        <span class="ch-title">${ch.title}</span>
      </div>
      <span class="ch-arrow">▾</span>
    `;

    const body = document.createElement('div');
    body.className = 'chapter-body' + (ci === 0 ? ' open' : '');

    // Section sub-tabs
    const stBar = document.createElement('div');
    stBar.className = 'section-tab-bar';
    ch.sections.forEach((sec, si) => {
      const stBtn = document.createElement('button');
      stBtn.className = 'section-tab' + (si === 0 ? ' active' : '');
      stBtn.textContent = sec.name;
      stBtn.onclick = () => {
        stBar.querySelectorAll('.section-tab').forEach(b => b.classList.remove('active'));
        stBtn.classList.add('active');
        body.querySelectorAll('.section-pane').forEach(p => p.classList.remove('active'));
        body.querySelectorAll('.section-pane')[si].classList.add('active');
      };
      stBar.appendChild(stBtn);
    });
    body.appendChild(stBar);

    ch.sections.forEach((sec, si) => {
      const pane = document.createElement('div');
      pane.className = 'section-pane' + (si === 0 ? ' active' : '');
      pane.innerHTML = sec.content;
      body.appendChild(pane);
    });

    header.onclick = () => {
      const isOpen = header.classList.contains('open');
      header.classList.toggle('open', !isOpen);
      body.classList.toggle('open', !isOpen);
    };

    block.appendChild(header);
    block.appendChild(body);
    root.appendChild(block);
  });
}

// BUILD QUIZ
// ══════════════════════════════════════
function buildQuiz(containerId, data, prefix) {
  const root = document.getElementById(containerId);
  root.innerHTML = '';
  data.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = `${prefix}-card-${idx}`;

    const numTag = document.createElement('div');
    numTag.className = 'q-num-tag';
    numTag.textContent = `Q${idx + 1} of ${data.length}`;

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = item.q;

    const optList = document.createElement('div');
    optList.className = 'opt-list';

    item.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-letter">${['A','B','C','D'][oi]}</span>${opt}`;
      btn.onclick = () => handleAnswer(prefix, idx, oi, item.ans, item.fb, card, optList);
      optList.appendChild(btn);
    });

    const fb = document.createElement('div');
    fb.className = 'feedback-strip';

    card.appendChild(numTag);
    card.appendChild(qText);
    card.appendChild(optList);
    card.appendChild(fb);
    root.appendChild(card);
  });
}

function handleAnswer(prefix, qIdx, chosen, correct, fbText, card, optList) {
  const btns = optList.querySelectorAll('.opt-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('correct');
    else if (i === chosen && chosen !== correct) b.classList.add('wrong');
  });

  const isRight = chosen === correct;
  const fbEl = card.querySelector('.feedback-strip');
  fbEl.className = 'feedback-strip ' + (isRight ? 'correct-fb' : 'wrong-fb');
  fbEl.innerHTML = `<span class="fb-icon">${isRight ? '✓' : '✗'}</span>${fbText}`;
  fbEl.style.display = 'block';

  card.classList.add(isRight ? 'answered-right' : 'answered-wrong');
  card.querySelector('.q-num-tag').textContent = isRight ? `Q${qIdx+1} — Correct ✓` : `Q${qIdx+1} — Incorrect ✗`;

  state[prefix].answered++;
  if (isRight) state[prefix].correct++;
  updateScore(prefix);
}

function updateScore(prefix) {
  const s = state[prefix];
  document.getElementById(`${prefix}-score`).textContent = `${s.correct} / ${s.answered}`;
  const pct = s.answered > 0 ? Math.round(s.correct / s.answered * 100) : 0;
  document.getElementById(`${prefix}-pct`).textContent = s.answered > 0 ? `${pct}%` : '—';
  const progPct = s.total > 0 ? (s.answered / s.total * 100) : 0;
  document.getElementById(`${prefix}-prog`).style.width = progPct + '%';
}

function resetQuiz(prefix) {
  if (prefix === 'p') {
    state.p = { correct: 0, answered: 0, total: PREV_MCQ.length };
    buildQuiz('prev-quiz-root', PREV_MCQ, 'p');
  } else {
    const data = getFilteredData(state.c.filter);
    state.c = { correct: 0, answered: 0, total: data.length, filter: state.c.filter };
    buildQuiz('ch-quiz-root', data, 'c');
  }
  updateScore(prefix);
}

function getFilteredData(filter) {
  if (filter === 'All') {
    return Object.values(CH_MCQ).flat();
  }
  return CH_MCQ[filter] || [];
}

// ══════════════════════════════════════
// BUILD CHAPTER FILTER
// ══════════════════════════════════════
function buildChapterFilter() {
  const bar = document.getElementById('ch-filter-bar');
  const filters = ['All', 'Ch 8', 'Ch 9', 'Ch 10', 'Ch 11', 'Ch 12', 'Ch 13', 'Ch 14'];
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (f === 'All' ? ' active' : '');
    btn.textContent = f === 'All' ? `All (${Object.values(CH_MCQ).flat().length} Qs)` : f;
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const data = getFilteredData(f);
      state.c = { correct: 0, answered: 0, total: data.length, filter: f };
      buildQuiz('ch-quiz-root', data, 'c');
      updateScore('c');
    };
    bar.appendChild(btn);
  });
}

// ══════════════════════════════════════
// BUILD ESSAY
// ══════════════════════════════════════
function buildEssay() {
  const root = document.getElementById('essay-root');
  ESSAY.forEach(e => {
    const card = document.createElement('div');
    card.className = 'essay-card';
    let html = `<div class="essay-num">${e.num}</div><div class="essay-title">${e.title}</div>`;
    e.sections.forEach(s => {
      html += `<div class="essay-section-head">${s.head}</div><div class="essay-body">${s.body}</div>`;
    });
    card.innerHTML = html;
    root.appendChild(card);
  });
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
buildSummary();
buildQuiz('prev-quiz-root', PREV_MCQ, 'p');
buildChapterFilter();
const allData = getFilteredData('All');
state.c.total = allData.length;
buildQuiz('ch-quiz-root', allData, 'c');
updateScore('p');
updateScore('c');
buildEssay();
</script>
