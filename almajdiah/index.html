<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>بنك معلومات مركز اتصال الماجدية — محتوى محمي</title>
<style>
:root{--bg:#12151A;--surface:#1A1E26;--border:#2A2F3A;--text:#E6E9EF;--muted:#8B93A3;--primary:#5B8DB8;--alert:#C46A5E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Tahoma",system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:30px}
h1{font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.7}
input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;font-size:15px;font-family:inherit}
input:focus{outline:1px solid var(--primary);border-color:var(--primary)}
button{width:100%;margin-top:14px;background:var(--primary);color:#0f1216;border:none;border-radius:6px;
  padding:11px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
button:hover{filter:brightness(1.1)}
.err{color:var(--alert);font-size:13px;margin-top:12px;min-height:20px}
.lock{font-size:34px;margin-bottom:14px}
.note{border-top:1px dashed var(--border);margin-top:18px;padding-top:12px;font-size:11.5px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="panel">
  <div class="lock">🔒</div>
  <h1>بنك معلومات مركز اتصال الماجدية</h1>
  <div class="sub">هذا المحتوى مشفر بالكامل (AES-256). أدخل كلمة المرور للمتابعة.</div>
  <input type="password" id="pw" placeholder="كلمة المرور" autofocus>
  <button onclick="unlock()">فتح</button>
  <div class="err" id="err"></div>
  <div class="note">الملف نفسه لا يحتوي إلا نصاً مشفراً — فك التشفير يتم في متصفحك فقط ولا تُرسل كلمة المرور لأي جهة.</div>
</div>

const ITER=310000;
function b64buf(b64){const s=atob(b64);const a=new Uint8Array(s.length);

async function unlock(){
  const pw=document.getElementById("pw").value;

    document.open();document.write(html);document.close();
