<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOM 500 — Full Study Guide (Ch 1–14)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--s:#151821;--s2:#1c2029;--s3:#242832;--b:#2a2f3d;--t:#e8eaf2;--td:#7d829a;--r:#ff6b6b;--o:#ffa94d;--g:#4ade80;--bl:#60a5fa;--p:#a78bfa;--c:#22d3ee;--w:#fbbf24}
.light{--bg:#f5f6fa;--s:#ffffff;--s2:#f0f1f5;--s3:#e8e9ef;--b:#d8dae3;--t:#1a1d2e;--td:#5c6078;--r:#e03131;--o:#e67700;--g:#2b8a3e;--bl:#1971c2;--p:#7048c6;--c:#0c8599;--w:#e67700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--t);line-height:1.65;min-height:100vh}
.app{max-width:860px;margin:0 auto;padding:16px}
button{cursor:pointer;font-family:inherit}
.theme-btn{position:fixed;top:14px;right:14px;z-index:99;width:42px;height:42px;border-radius:50%;border:1px solid var(--b);background:var(--s);color:var(--t);font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0003;transition:.2s}
.theme-btn:hover{transform:scale(1.1)}
.light .fc-fr{background:linear-gradient(135deg,#e8ecf4,#dde3f0);border-color:#1971c233}
.light .fc-bk{background:linear-gradient(135deg,#e4f5e8,#d4edda);border-color:#2b8a3e33}
.light .method{background:linear-gradient(135deg,#edf0f8,#e8ecf5)}
.light .wel-ar{background:var(--s2)}
.light .start-btn{background:linear-gradient(135deg,var(--bl),var(--p))}

/* Header */
.hdr{text-align:center;padding:32px 16px 20px;margin-bottom:24px}
.hdr h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--bl),var(--p),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.hdr p{color:var(--td);font-size:.85rem}
.hdr .sub{display:inline-block;background:#ff6b6b14;color:var(--r);padding:4px 14px;border-radius:14px;font-size:.78rem;font-weight:600;margin-top:8px;border:1px solid #ff6b6b25}

/* Progress Bar */
.prog{display:flex;gap:4px;margin-bottom:24px;padding:6px;background:var(--s);border-radius:12px;border:1px solid var(--b)}
.prog-step{flex:1;text-align:center;padding:10px 6px;border-radius:8px;font-size:.72rem;font-weight:600;color:var(--td);transition:.3s;position:relative}
.prog-step.active{background:var(--bl);color:#fff}
.prog-step.done{background:#4ade8018;color:var(--g)}
.prog-step .num{display:block;font-size:.9rem;font-weight:800;margin-bottom:2px}

/* Method Box */
.method{background:linear-gradient(135deg,#1a1e2e,#1e2236);border:1px solid var(--b);border-radius:14px;padding:24px;margin-bottom:20px}
.method h2{font-size:1rem;font-weight:700;margin-bottom:10px;color:var(--c)}
.method p{font-size:.84rem;color:var(--td);line-height:1.7}
.method .highlight{color:var(--t);font-weight:600}
.method-steps{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.method-s{flex:1;min-width:100px;background:var(--s);padding:12px;border-radius:10px;text-align:center;border:1px solid var(--b)}
.method-s .ico{font-size:1.3rem;margin-bottom:4px}
.method-s .lab{font-size:.7rem;color:var(--td);font-weight:600}
.method-s.cur{border-color:var(--bl);background:#60a5fa0a}

/* Chapter Tabs */
.chtabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}
.chtab{padding:7px 14px;border:1px solid var(--b);background:var(--s);color:var(--td);font-size:.75rem;font-weight:600;border-radius:8px;transition:.2s}
.chtab.a{background:var(--bl);color:#fff;border-color:var(--bl)}
.chtab:hover:not(.a){background:var(--s2);color:var(--t)}

/* Concept Cards */
.cc{background:var(--s);border:1px solid var(--b);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:.2s}
.cc:hover{border-color:#60a5fa33}
.cc-h{padding:16px 20px;display:flex;align-items:center;gap:10px;cursor:pointer}
.cc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cc-hi .cc-dot{background:var(--r)}.cc-mi .cc-dot{background:var(--o)}.cc-lo .cc-dot{background:var(--g)}
.cc-t{font-size:.9rem;font-weight:700;flex:1}
.cc-ch{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:5px}
.cc-c1{background:#60a5fa14;color:var(--bl)}.cc-c2{background:#a78bfa14;color:var(--p)}.cc-c3{background:#ffa94d14;color:var(--o)}.cc-c4{background:#4ade8014;color:var(--g)}.cc-c5{background:#ff6b6b14;color:var(--r)}.cc-c6{background:#22d3ee14;color:var(--c)}.cc-c7{background:#60a5fa14;color:var(--bl)}.cc-c8{background:#a78bfa14;color:var(--p)}.cc-c9{background:#ffa94d14;color:var(--o)}.cc-c10{background:#4ade8014;color:var(--g)}.cc-c11{background:#ff6b6b14;color:var(--r)}.cc-c12{background:#22d3ee14;color:var(--c)}.cc-c13{background:#fbbf2414;color:var(--w)}.cc-c14{background:#f472b614;color:#f472b6}
.cc-tg{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:6px;text-transform:uppercase}
.cc-hi .cc-tg{background:#ff6b6b12;color:var(--r)}.cc-mi .cc-tg{background:#ffa94d12;color:var(--o)}.cc-lo .cc-tg{background:#4ade8012;color:var(--g)}
.cc-b{padding:0 20px 16px;color:var(--td);font-size:.83rem;display:none}
.cc.open .cc-b{display:block}
.cc-b strong{color:var(--t);font-weight:600}
.cc-arr{color:var(--td);font-size:.8rem;transition:.2s}
.cc.open .cc-arr{transform:rotate(180deg)}
.kt{display:inline-block;background:#60a5fa12;color:var(--bl);padding:1px 6px;border-radius:4px;font-size:.76rem;font-weight:500;font-family:'JetBrains Mono',monospace;margin:1px}
.tb{width:100%;border-collapse:separate;border-spacing:0;margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid var(--b)}
.tb th{background:var(--s3);padding:7px 10px;font-size:.72rem;font-weight:700;text-align:left;color:var(--c);text-transform:uppercase}
.tb td{padding:7px 10px;font-size:.78rem;border-top:1px solid var(--b);color:var(--td)}

/* Check button */
.cc-check{display:flex;justify-content:flex-end;padding:0 20px 14px}
.check-btn{padding:6px 16px;border:1px solid var(--g)44;background:#4ade800a;color:var(--g);font-size:.78rem;font-weight:600;border-radius:7px;transition:.2s}
.check-btn:hover{background:#4ade8018}
.check-btn.checked{background:var(--g);color:#000}

/* Flashcard */
.fc-wrap{perspective:1000px;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:200px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.fl{transform:rotateY(180deg)}
.fc-f{position:absolute;top:0;left:0;width:100%;min-height:200px;backface-visibility:hidden;border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-fr{background:linear-gradient(135deg,#171d30,#1c2440);border:2px solid #60a5fa28}
.fc-bk{background:linear-gradient(135deg,#152015,#1a2e1a);border:2px solid #4ade8028;transform:rotateY(180deg)}
.fc-lb{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.fc-fr .fc-lb{color:var(--bl)}.fc-bk .fc-lb{color:var(--g)}
.fc-tx{font-size:.95rem;font-weight:600;line-height:1.6}
.fc-ht{font-size:.7rem;color:var(--td);margin-top:10px}
.fc-nav{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap}
.fc-btn{padding:8px 18px;border:1px solid var(--b);background:var(--s);color:var(--t);font-size:.8rem;font-weight:600;border-radius:8px}
.fc-btn:hover{background:var(--s2)}
.fc-btn.got{border-color:#4ade8044;color:var(--g)}.fc-btn.rev{border-color:#ff6b6b44;color:var(--r)}
.fc-cnt{color:var(--td);font-size:.8rem;font-weight:600;min-width:60px;text-align:center}
.fc-score{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;font-size:.78rem}
.fc-score div span{display:block;font-size:1.1rem;font-weight:800;margin-bottom:2px}
.fc-score .gn span{color:var(--g)}.fc-score .rv span{color:var(--r)}

/* Quiz */
.qz{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:10px}
.qz-t{font-size:.88rem;font-weight:600;margin-bottom:12px;line-height:1.5}
.qz-n{display:inline-block;background:#a78bfa12;color:var(--p);width:24px;height:24px;line-height:24px;text-align:center;border-radius:5px;font-size:.72rem;font-weight:700;margin-right:6px}
.qz-o{display:flex;flex-direction:column;gap:5px}
.qz-b{padding:9px 13px;border:1px solid var(--b);background:var(--s2);color:var(--td);font-size:.82rem;border-radius:7px;text-align:left;transition:.2s}
.qz-b:hover{border-color:#60a5fa33;color:var(--t)}
.qz-b.ok{background:#4ade800e;border-color:var(--g);color:var(--g)}
.qz-b.no{background:#ff6b6b0e;border-color:var(--r);color:var(--r)}
.qz-b.dis{pointer-events:none}
.qz-bar{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qz-sl{font-size:.8rem;color:var(--td)}.qz-sv{font-size:1.1rem;font-weight:800;color:var(--g)}

/* Essay */
.es{background:var(--s);border:1px solid var(--b);border-radius:12px;margin-bottom:10px;overflow:hidden}
.es-h{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
.es-h:hover{background:var(--s2)}
.es-t{font-weight:700;font-size:.88rem}
.es-tg{color:var(--bl);font-size:.75rem;font-weight:600}
.es-b{padding:0 18px 14px;border-top:1px solid var(--b);color:var(--td);font-size:.82rem;line-height:1.7}
.es-b.hid{display:none}
.es-model{white-space:pre-line;padding:14px 0;line-height:1.8}
.es-reveal{display:block;width:100%;padding:10px;border:1px dashed var(--bl);background:transparent;color:var(--bl);font-family:inherit;font-size:.82rem;font-weight:600;border-radius:8px;margin:10px 0;transition:.2s}
.es-reveal:hover{background:#60a5fa0a}
.es-prompt{text-align:center;padding:16px;color:var(--td);font-size:.84rem;font-style:italic}
.es-ta{width:100%;min-height:160px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit;font-size:.84rem;padding:14px;line-height:1.7;resize:vertical;margin:10px 0}
.es-ta:focus{outline:none;border-color:var(--bl)}
.es-ta::placeholder{color:var(--td);opacity:.6}
.es-wc{text-align:right;font-size:.7rem;color:var(--td);margin-top:-6px;margin-bottom:8px}
.es-check{margin-top:14px;padding-top:12px;border-top:1px solid var(--b)}
.es-check h4{font-size:.8rem;font-weight:700;color:var(--w);margin-bottom:8px}
.es-chk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:.8rem;color:var(--td);cursor:pointer}
.es-chk input{margin-top:3px;accent-color:var(--g);width:16px;height:16px;flex-shrink:0}
.es-chk.checked{color:var(--g);text-decoration:line-through;opacity:.7}
.es-score{background:var(--s2);border-radius:8px;padding:10px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.es-score .lbl{color:var(--td)}.es-score .val{font-weight:800}

.big-btn{display:block;width:100%;padding:14px;border:none;font-family:inherit;font-size:.9rem;font-weight:700;border-radius:10px;margin-top:16px;transition:.2s}
.big-btn.primary{background:var(--bl);color:#fff}
.big-btn.primary:hover{background:#4d94e6}
.reset-btn{display:block;margin:12px auto;padding:8px 20px;background:var(--p);color:#fff;border:none;font-family:inherit;font-size:.82rem;font-weight:700;border-radius:7px}
.info-box{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:16px;font-size:.83rem;color:var(--td);line-height:1.7}
.info-box strong{color:var(--t)}
@media(max-width:600px){.hdr h1{font-size:1.3rem}.prog-step{font-size:.65rem;padding:8px 3px}.prog-step .num{font-size:.75rem}}

/* Welcome */
.wel{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:32px 24px;margin-bottom:20px;text-align:center}
.wel h2{font-size:1.3rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--bl),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wel .book{color:var(--td);font-size:.78rem;margin-bottom:20px;line-height:1.6}
.wel .book strong{color:var(--t)}
.wel-ar{text-align:right;direction:rtl;background:var(--s2);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--b)}
.wel-ar h3{font-size:1rem;font-weight:700;color:var(--c);margin-bottom:10px}
.wel-ar p{font-size:.84rem;color:var(--td);line-height:1.8;margin-bottom:8px}
.wel-ar .num-ar{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:.75rem;font-weight:800;margin-left:6px}
.wel-ar .n1{background:#60a5fa20;color:var(--bl)}.wel-ar .n2{background:#a78bfa20;color:var(--p)}.wel-ar .n3{background:#4ade8020;color:var(--g)}.wel-ar .n4{background:#ffa94d20;color:var(--o)}
.wel-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.wel-s{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:14px 8px;text-align:center}
.wel-s .ico{font-size:1.5rem;margin-bottom:6px}
.wel-s .lab{font-size:.72rem;font-weight:600;color:var(--td)}
.wel-s .desc{font-size:.65rem;color:var(--td);margin-top:3px;opacity:.7}
.start-btn{display:block;width:100%;padding:16px;border:none;background:linear-gradient(135deg,var(--bl),var(--p));color:#fff;font-family:inherit;font-size:1rem;font-weight:800;border-radius:12px;cursor:pointer;margin-top:16px;transition:.2s;letter-spacing:.5px}
.start-btn:hover{opacity:.9;transform:translateY(-1px)}
.credit{text-align:center;margin-top:12px;font-size:.7rem;color:var(--td);opacity:.6}
/* Abbreviations */
.abbr-btn{position:fixed;bottom:14px;right:14px;z-index:99;padding:8px 14px;border-radius:20px;border:1px solid var(--b);background:var(--s);color:var(--bl);font-family:inherit;font-size:.75rem;font-weight:700;box-shadow:0 2px 10px #0003;transition:.2s}
.abbr-btn:hover{background:var(--s2)}
.abbr-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.abbr-panel{background:var(--s);border:1px solid var(--b);border-radius:14px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px}
.abbr-panel h3{font-size:1rem;font-weight:800;color:var(--c);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.abbr-close{background:none;border:none;color:var(--td);font-size:1.3rem;cursor:pointer}
.abbr-ch{font-size:.72rem;font-weight:700;color:var(--bl);padding:8px 0 4px;border-bottom:1px solid var(--b);margin-top:10px}
.abbr-row{display:flex;gap:8px;padding:4px 0;font-size:.78rem;border-bottom:1px solid #2a2f3d22}
.abbr-row .ab{color:var(--c);font-weight:700;font-family:'JetBrains Mono',monospace;min-width:65px;flex-shrink:0}
.abbr-row .fu{color:var(--td)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ========== DATA ==========
const concepts=[
// CH1
{c:1,t:'Digital Transformation & Key Terms',p:2,b:`<strong>Digital transformation</strong> = using tech to change how business works & creates value. Tech IS the business.<br><span class="kt">IT architecture</span> planning/acquiring/building IT resources · <span class="kt">Legacy systems</span> older IS · <span class="kt">Technology platform</span> Hardware (HW) + Operating System (OS) base · <span class="kt">Technology stack</span> all layers (Hardware, Software, network, analytics) on top of platform<br><strong>Key technologies:</strong> Mobile, Social, Cloud, Big Data, Analytics, Artificial Intelligence (AI), Internet of Things (IoT), Visualization<br><strong>Data analytics</strong> = examining data sets to draw conclusions`},
{c:1,t:'⭐ 7 Disruptive Business Models',p:2,b:`<span class="kt">Subscription</span> monthly payment for continued access (Netflix, Apple Music)<br><span class="kt">Freemium</span> basic free, paid upgrade (LinkedIn, Dropbox)<br><span class="kt">Free</span> customer IS the product — earns from ads/data (Google, Facebook)<br><span class="kt">Access-over-Ownership</span> temporary use, not own (Airbnb, Zipcar)<br><span class="kt">Experience</span> unique experience, premium price (Tesla, Apple)<br><span class="kt">On-Demand</span> fast service when needed (Uber, TaskRabbit)<br><span class="kt">Ecosystem</span> connected products increase in value together (Apple, Google)`},
{c:1,t:'On-Demand vs Sharing Economy',p:2,b:`<strong>On-Demand</strong> = "get it now" — immediate fulfillment via tech (Uber, GrubHub). Focus: speed, convenience, personalization<br><strong>Sharing Economy</strong> = "use without owning" — share goods/services via platform (Airbnb, bike rentals). Focus: existing resources, access, coordination`},
{c:1,t:'⭐ 6 Business Objectives of IT',p:2,b:`<strong>1. Product Development</strong> — respond to changing needs · <strong>2. Stakeholder Integration</strong> — communicate with shareholders · <strong>3. Process Improvement</strong> — Enterprise Resource Planning (ERP) replaces legacy · <strong>4. Cost Efficiencies</strong> — reduce transaction costs · <strong>5. Competitive Advantage</strong> — faster products to market · <strong>6. Globalization</strong> — global ops 24/7<br><em>Memory: <strong>D-I-I-C-C-G</strong> (Develop, Integrate, Improve, Cut costs, Compete, Globalize)</em>`},
{c:1,t:'⭐ 10 IT Management Issues',p:2,b:`1. Security, Cybersecurity & Privacy · 2. Technology Alignment with Business · 3. Data Analytics · 4. Compliance & Regulations · 5. IT Cost Reduction · 6. Business Cost Reduction · 7. Innovation · 8. Digital Transformation · 9. Business Agility · 10. IT Agility`},
{c:1,t:'SMAC Model & Megatrends',p:1,b:`<span class="kt">Social</span> connects people · <span class="kt">Mobile</span> access anywhere · <span class="kt">Analytics</span> data→insights · <span class="kt">Cloud</span> storage & computing. Cloud=core, Mobile=edge, Social connects them.<br><strong>Megatrends:</strong> Connectivity, Big Data, AI & Robotics, Digitization, Machine-to-Machine (M2M), IoT<br><strong>COVID-19</strong> accelerated digital transformation — forced remote work, e-commerce, virtual meetings`},
{c:1,t:'⭐ Business Process & BPR',p:2,b:`<strong>Business Process</strong> = series of steps: Inputs → Activities → Deliverables. Examples: invoicing, recruiting, shipping<br><strong>Formal / Standard Operating Procedure (SOP)</strong> = documented | <strong>Informal</strong> = undocumented, flexible<br><strong>Cross-functional</strong> = involves 2+ functions (e.g., order fulfillment = sales + operations)<br><strong>Business Process Reengineering (BPR)</strong> = RADICAL redesign. Slogan: <em>"Don't automate, obliterate!"</em><br><strong>8 BPR stages:</strong> 1)Vision 2)Understand existing 3)Identify for redesign 4)Change levers 5)Implement 6)Operationalize 7)Evaluate 8)Continuous improvement<br><strong>BPR</strong> = radical redesign | <strong>Business Process Management (BPM)</strong> = ongoing continuous improvement<br><strong>Competitive advantage</strong> = lower cost OR better quality OR more value. Requires: forecasting, watching competitors, acting quickly, agile IT`},
{c:1,t:'IT & Your Career',p:0,b:`<strong>Informed user</strong> = person knowledgeable about IS & IT. Benefits: improve performance, give input on IT decisions, spot new tech<br><strong>6 IS components:</strong> Hardware, Software, Procedures, People, Networks, Data<br><strong>Gig Economy:</strong> 70% satisfied, 81% continue, 63% happier. IT job market: 12% growth, high salaries, <2% unemployment`},

// CH2
{c:2,t:'Information System & IPOS',p:2,b:`<strong>Information System (IS)</strong> = combination of Information Technology (IT) + people. Supports: business processes, operations, management, decisions<br><strong>IPOS Cycle (Input, Processing, Output, Storage):</strong> Input → Processing → Output → Storage + Feedback<br>An IS is NOT just a computer — it's the whole system working together.`},
{c:2,t:'⭐ 6 Components of an IS',p:2,b:`<strong>1. Hardware</strong> — physical devices (CPU, keyboard, printer) · <strong>2. Software</strong> — programs (OS, browser, Office) · <strong>3. People</strong> — analysts, programmers, end users · <strong>4. Procedures</strong> — rules/manuals for using system · <strong>5. Networks</strong> — communication links · <strong>6. Data</strong> — raw facts (invoices, payments)<br><strong>DATA IS THE CENTRAL COMPONENT</strong> — without data, the system has no purpose.`},
{c:2,t:'⭐ DIKW Pyramid (Data → Information → Knowledge → Wisdom)',p:2,b:`<strong>Data</strong> → raw facts (sales numbers)<br><strong>Information</strong> → processed with meaning — answers who/what/where/when<br><strong>Knowledge</strong> → info + experience — answers HOW (how to improve sales)<br><strong>Wisdom</strong> → judgment + values — answers WHY (why sales dropped, what strategic action)<br><strong>Explicit knowledge</strong> = easy to share (books, manuals) | <strong>Tacit knowledge</strong> = personal, hard to transfer (hands-on skill, know-how)`},
{c:2,t:'⭐ TPS (Essay Topic)',p:2,b:`<strong>Transaction Processing System (TPS)</strong> = an IS that collects, monitors, stores, processes, and distributes specific types of data input from ongoing transactions<br><strong>Internal:</strong> originate or occur within org (payroll, budget transfer) | <strong>External:</strong> originate outside (customer purchase, supplier order)<br><strong>Real-time / Online Transaction Processing (OLTP):</strong> processes each transaction as it occurs (airline reservation)<br><strong>Batch:</strong> collects all, processes at predetermined time (weekly payroll) — cheaper but may be inaccurate from update delays<br><strong>Missing transactions →</strong> lost sales, wrong financials, unhappy customers, duplicate payments, lost revenue`},
{c:2,t:'MIS, DSS & EIS',p:1,b:`<strong>Management Information System (MIS)</strong> (Middle Mgmt): routine reports — Periodic (daily/weekly), Exception (unusual events), Ad hoc (unplanned). Supports <em>structured</em> decisions.<br><strong>Decision Support System (DSS)</strong> (Senior Mgmt): uses models for analysis — What-if analysis, Goal-seeking, Sensitivity analysis. Supports <em>semi/unstructured</em> decisions.<br><strong>Executive Information System (EIS)</strong> (Executives): strategic big-picture, long-term trends, internal + external data, dashboards.<br><strong>Flow:</strong> TPS → MIS → DSS → EIS (each builds on the lower)`},
{c:2,t:'⭐ Infrastructure vs Architecture vs EA',p:2,b:`<table class="tb"><tr><th>Concept</th><th>What</th><th>Includes</th></tr><tr><td><strong>IT Infrastructure</strong></td><td>Physical IT resources</td><td>HW, SW, networks, data centers — NOT people/processes</td></tr><tr><td><strong>IT Architecture</strong></td><td>Blueprint for tech planning</td><td>Standards, investments, deployment plan</td></tr><tr><td><strong>Enterprise Architecture (EA)</strong></td><td>Enterprise-wide plan</td><td>Strategy + processes + info + IT assets</td></tr></table>EA benefits: cuts IT costs, better alignment, long-term direction. EA must be <strong>dynamic</strong> — changes with business.<br><strong>Key Performance Indicators (KPIs)</strong> measure EA success: Capabilities, Operational, Project, Financial performance`},
{c:2,t:'Cloud & XaaS Models',p:1,b:`<strong>Public Cloud:</strong> shared, general public | <strong>Private Cloud:</strong> single org, more control/security<br><span class="kt">SaaS</span> software via web (Google Docs) · <span class="kt">PaaS</span> dev platform · <span class="kt">IaaS</span> servers on demand · <span class="kt">DaaS</span> data access · <span class="kt">TSaaS</span> combined solutions<br><strong>Cloud Service Agreement (CSA)</strong> covers: performance, security, privacy, Disaster Recovery, governance, termination`},
{c:2,t:'Virtualization',p:1,b:`One physical machine → multiple Virtual Machines / VMs (each with virtual CPU, RAM, HD, OS).<br><strong>Types:</strong> Storage, Server, Desktop, Application, Network, Hardware<br><strong>Benefits:</strong> flexibility, cost reduction, energy savings, scalability, load balancing<br><strong>Software-Defined Data Center (SDDC):</strong> Traditional → Virtualized → Software-Defined Data Center`},

// CH3
{c:3,t:'⭐ Effective Data Management (Essay)',p:2,b:`Oversees <strong>end-to-end lifecycle</strong>: creation → storage → deletion when obsolete.<br><strong>6 Goals:</strong><br>1) Mitigate compliance risks & costs<br>2) Ensure legal requirements met<br>3) Safeguard data security<br>4) Maintain accuracy & availability<br>5) Ensure consistency across locations<br>6) Follow best practices for access, storage, backup, disposal<br><strong>Benefits:</strong> greater compliance, higher security, less legal liability, better sales/marketing, improved product classification, better governance`},
{c:3,t:'⭐ Centralized DB (Essay)',p:2,b:`<strong>Centralized:</strong> stores ALL data as a unified body in a single central computer (such as a mainframe or server) in one physical location<br><strong>Benefits:</strong> 1) Better control of data quality 2) Ease of use 3) Better IT security 4) Better data integrity<br><strong>Disadvantages:</strong> 1) Transmission delay 2) Security (single point of failure) 3) Reliability 4) Scalability<br><strong>Distributed:</strong> stores portions of database on multiple computers controlled by DBMS within a network. Pros: speed, reliability, scalability, workload sharing. Cons: cost, network dependency, security if authority attacked`},
{c:3,t:'ACID & DBMS',p:1,b:`<span class="kt">Atomicity</span> all or nothing · <span class="kt">Consistency</span> data valid after · <span class="kt">Isolation</span> no interference · <span class="kt">Durability</span> saved permanently<br><strong>Database Management System (DBMS) provides:</strong> filtering/profiling, integrity, synchronization, security, access + CRUD operations (Create, Read, Update, Delete)<br><strong>4 DBMS elements:</strong> Data structure, Data modeling language, Query language, Transaction mechanism`},
{c:3,t:'OLTP vs OLAP',p:1,b:`<strong>Online Transaction Processing (OLTP)</strong> = fast daily transactions (sales, payments) — speed & real-time<br><strong>Online Analytics Processing (OLAP)</strong> = complex analysis from data warehouse — decision support & reporting<br><em>"OLTP runs the business, OLAP analyzes the business"</em>`},
{c:3,t:'Database Models & Blockchain',p:1,b:`1. <strong>Hierarchical:</strong> tree, parent-child — struggles with many-to-many<br>2. <strong>Network:</strong> multiple parents — complex<br>3. <strong>Relational:</strong> tables with rows/columns — most used<br>4. <strong>Object-Oriented:</strong> data as objects — engineering/telecom<br>5. <strong>Blockchain:</strong> distributed ledger (data + timestamp + hash + previous hash). Security: hash, proof-of-work, peer-to-peer, consensus. <strong>Smart contracts</strong> = auto-execute<br><strong>Structured Query Language (SQL)</strong> = relational, tables | <strong>NoSQL (Non-Relational)</strong> = flexible, no schema, 4 types: key-value, column, document, graph`},
{c:3,t:'Data Warehouse, Mart, Lake & ETL',p:1,b:`<strong>Warehouse:</strong> enterprise-wide, cleaned, integrated historical data for Business Intelligence (BI). Subject-oriented, integrated, time-variant, non-volatile<br><strong>Mart:</strong> smaller, one department — cheaper, faster<br><strong>Lake:</strong> raw data, transformed later as needed<br><strong>ETL (Extract, Transform, Load):</strong> Extract → Transform → Load<br><strong>Change Data Capture (CDC):</strong> tracks only changed data | <strong>Deduplication:</strong> removes duplicates`},
{c:3,t:'Data Governance, MDM & Dirty Data',p:1,b:`<strong>Governance:</strong> managing availability, usability, integrity, security across enterprise<br><strong>Master Data Management (MDM):</strong> ONE trusted version of core data (customers, products, suppliers)<br><strong>Dirty Data</strong> = poor quality (incomplete, outdated, incorrect, duplicated) → bad decisions. <em>10x more expensive to FIX than PREVENT!</em><br><strong>Data Silos</strong> = standalone stores, not accessible — trap info, reduce collaboration<br><strong>Electronic Document Management System (EDMS)</strong> = living documents | <strong>Electronic Records Management System (ERMS)</strong> = final records (compliance) | <strong>Enterprise Content Management System (ECMS)</strong> = all digital content`},

// CH4
{c:4,t:'⭐ LAN & Configurations (Essay)',p:2,b:`<strong>Network</strong> = computers connected to share resources. Functions: communication, search, mobility, collaboration, relationships<br><strong>Local Area Network (LAN)</strong> = limited area, one owner | <strong>Wide Area Network (WAN)</strong> = large area, multiple networks<br><span class="kt">Star</span> each device → central hub (most common)<br><span class="kt">Ring</span> closed loop, each connected to 2 neighbors<br><span class="kt">Bus</span> main channel with branches<br><strong>Other:</strong> Software-Defined WAN (SD-WAN), Wireless LAN (WLAN), Wireless WAN (WWAN), MAN, PAN, SAN, CAN`},
{c:4,t:'Intranet, Extranet, VPN & Components',p:1,b:`<strong>Intranet:</strong> internal only | <strong>Extranet:</strong> + authorized external | <strong>Virtual Private Network (VPN):</strong> encrypted secure connection<br><strong>Components:</strong> Client (computer), Server (central data), Router (chooses best path), Switch (efficient data), Hub (simple junction), Network Interface Card (NIC)<br><strong>Circuit switching:</strong> dedicated continuous path | <strong>Packet switching:</strong> data in small pieces, reassembled<br><strong>Internet Service Provider (ISP)</strong> = Internet access provider | <strong>Bandwidth</strong> = max bps capacity`},
{c:4,t:'Wireless, 4G/5G, TCP/IP & APIs',p:1,b:`<strong>4G:</strong> ~1 Gbps | <strong>5G:</strong> up to 10 Gbps, more devices, less delay. Cons: expensive, security concerns<br><strong>IEEE 802:</strong> 802.11ax (Wi-Fi 6), 802.11ac (Wi-Fi 5)<br><strong>Wireless media:</strong> Radio waves, Microwaves, Infrared, Bluetooth, Satellites<br><strong>TCP/IP:</strong> Application → Transport → Network → Data Link<br><strong>IP address:</strong> unique device ID. <span class="kt">IPv4</span> 32-bit (ran out) · <span class="kt">IPv6</span> 128-bit (IoT ready)<br><strong>Application Program Interface (API)</strong> = bridge for systems to communicate. <strong>REST (Representational State Transfer) API</strong> = lightweight web services`},
{c:4,t:'QR, RFID, NFC',p:1,b:`<span class="kt">QR Code</span> 2D barcode, more info. Low cost, secure. Must scan individually. Uses: payments, promotions<br><span class="kt">RFID</span> wireless radio tracking. Passive (3-5m, cheap) vs Active (100m, battery, expensive)<br><span class="kt">NFC</span> two-way communication between close devices. Uses: contactless payment, file transfer, ticketing<br><strong>QR</strong>=optical | <strong>RFID</strong>=radio tracking | <strong>NFC</strong>=close two-way`},
{c:4,t:'IoT & Edge Computing',p:1,b:`<strong>Internet of Things (IoT)</strong> = physical objects with sensors + connectivity → collect & exchange data<br>Benefits: monitor performance, support sales, remote troubleshooting, new products. Risks: security, privacy, cost<br><strong>Architecture:</strong> Sensors → Aggregate → Transmit → Analyze → Report → Store<br><strong>Edge Computing</strong> = processing NEAR source. Reduces latency, saves bandwidth, real-time decisions<br><strong>Fog node</strong> = physical device for fog computing<br><strong>Net Neutrality</strong> = ISPs treat all traffic equally. One-tier (equal) vs Two-tier (pay priority)<br><strong>Quality of Service (QoS)</strong> = managing network performance (prioritize/throttle traffic)`},

// CH5
{c:5,t:'CIA Triad & Key Definitions',p:2,b:`<span class="kt">Confidentiality</span> prevent unauthorized access · <span class="kt">Integrity</span> data accuracy · <span class="kt">Availability</span> system access<br><strong>Cyberattack</strong> = actual attempt to expose/destroy/steal · <strong>Cyberthreat</strong> = method used · <strong>Vulnerability</strong> = weakness · <strong>Attack vector</strong> = path to exploit<br><strong>4 breach cost categories:</strong> detection/escalation, notification, post-breach response, loss of business`},
{c:5,t:'⭐ Intentional Threats (Essay)',p:2,b:`<strong>Hacking:</strong> White hat (good), Black hat (malicious), Gray hat (mixed), <strong>Hacktivist</strong> (cause-driven)<br><strong>Social Engineering:</strong> manipulating people via trust/curiosity/urgency/fear<br><strong>Phishing:</strong> fake emails | <strong>Spear Phishing:</strong> targeted at specific group<br><strong>Malware:</strong> Virus (attaches), Worm (self-replicates), Trojan (disguised), Ransomware (locks for payment), Spyware, Adware, Keylogger, Rootkit, Backdoor, RAT<br><strong>Botnets:</strong> infected PCs controlled remotely for spam/DDoS · <strong>Cryptojacking:</strong> secretly mines crypto<br><strong>SQL Injection:</strong> malicious code in apps · <strong>MitM:</strong> attacker between 2 parties<br><span class="kt">DDoS</span> distributed from multiple sources · <span class="kt">TDoS</span> floods phone systems · <span class="kt">PDoS</span> permanently damages hardware<br><strong>Insider threats:</strong> employees misusing privileges · <strong>Data tampering:</strong> false data — serious, may go undetected<br><strong>Advanced Persistent Threat (APT):</strong> prolonged hidden espionage attack`},
{c:5,t:'⭐ Unintentional Threats (Essay)',p:2,b:`<strong>3 categories:</strong><br>1. <strong>Human Error:</strong> bad design, programming mistakes, data entry errors, default passwords, falling for phishing, ignoring procedures<br>2. <strong>Environmental Hazards:</strong> volcanoes, earthquakes, blizzards, floods, power failures, fires, HVAC failures, explosions<br>3. <strong>Computer System Failures:</strong> poor manufacturing, defective materials, poor maintenance, inadequate testing`},
{c:5,t:'Defense Strategies & Risk Management',p:2,b:`<strong>6 Defense Strategies:</strong> 1)Prevention & Deterrence 2)Detection 3)Containment 4)Recovery 5)Correction 6)Awareness/Compliance<br><strong>4 Risk Mitigation:</strong> Accept (small risk) · Avoid (eliminate) · Limit (reduce) · Transfer (outsource/insure)<br><strong>Defense Tools:</strong> Antivirus, IDS (detect), IPS (auto-block), IP Intelligence<br><strong>Mobile security:</strong> biometrics, remote wipe, encryption, do-not-carry rules`},
{c:5,t:'BCP, DRP & Defense Controls',p:1,b:`<strong>Business Continuity Plan (BCP):</strong> keep running during/after disruption | <strong>Disaster Recovery Plan (DRP):</strong> restore IT after major disruption<br><strong>Hot site</strong> = immediate, most expensive · <strong>Warm</strong> = hours, equipped · <strong>Cold</strong> = days, space only, cheapest<br><strong>Recovery Time Objective (RTO)</strong> = max acceptable downtime | <strong>Recovery Point Objective (RPO)</strong> = max acceptable data loss<br><strong>5 General Controls:</strong> Physical, Access, Data Security, Communication, Administrative<br><strong>8 Application Controls:</strong> Completeness, Validity, Authentication, Authorization, Input, Availability, Whitelisting, Blacklisting<br><strong>Defense-in-Depth 4 Steps:</strong> 1)Senior mgmt commitment 2)Acceptable Use Policy (AUP) + training 3)Security procedures 4)Hardware/Software defenses`},
{c:5,t:'Privacy & Governance Frameworks',p:1,b:`<strong>Privacy Paradox:</strong> people SAY privacy matters but don't protect it<br><strong>4 Privacy Concerns:</strong> sharing with 3rd parties, collection, usage, regulation<br><strong>General Data Protection Regulation / GDPR</strong> (EU): strictest, applies globally for EU data | <strong>California Consumer Privacy Act / CCPA</strong> (California): right to know/access/opt-out/delete<br><strong>US laws:</strong> Health Insurance Portability HIPAA (health) Accountability Act / HIPAA (health), Gramm-Leach-Bliley (financial), Driver's Privacy Protection Act / DPPA (driver), Fair Credit Reporting<br><strong>Federal Information Security Management Act (FISMA):</strong> federal agencies security programs | <strong>Enterprise Risk Management / ERM (COSO):</strong> 8-component risk framework | <strong>COBIT (Control Objectives for IT) 2019:</strong> IT governance aligning IT with business<br><strong>Major targets:</strong> weak passwords, critical infrastructure (16 sectors), IP, identity theft, Shadow IT / Bring Your Own Device (BYOD), social media`},

// CH6
{c:6,t:'Decision-Making & Bounded Rationality',p:1,b:`<strong>4 Phases:</strong> 1)Intelligence (find problem) 2)Design (create options) 3)Choice (select one) 4)Review (monitor, fix)<br><strong>Bounded rationality</strong> (Herbert Simon): limited by time/data/capacity<br><strong>Satisficing</strong> = "good enough" | <strong>Optimizing</strong> = best possible. Data analytics helps move toward optimizing.`},
{c:6,t:'⭐ 3 Levels of Analytics',p:2,b:`<span class="kt">Descriptive</span> What happened? (past summary)<br><span class="kt">Predictive</span> What could happen? (forecasting — regression, ML)<br><span class="kt">Prescriptive</span> What should we do? (optimization, decision models)<br>Complexity & value increase from descriptive → prescriptive`},
{c:6,t:'⭐ BI vs Data Science',p:2,b:`<table class="tb"><tr><th></th><th>BI</th><th>Data Science</th></tr><tr><td><strong>Focus</strong></td><td>Reports & current state</td><td>Predict & prescribe</td></tr><tr><td><strong>Data</strong></td><td>Structured, historical</td><td>All types + big data</td></tr><tr><td><strong>Questions</strong></td><td>Known unknowns</td><td>Unknown unknowns</td></tr><tr><td><strong>Tools</strong></td><td>Dashboards, reports</td><td>ML, algorithms, models</td></tr></table><strong>Traditional BI:</strong> dashboards, mashups, visualization | <strong>Modern BI:</strong> self-service, mobile, interactive, embedded<br><strong>Augmented analytics:</strong> AI/ML automates data prep & insights<br><strong>Platforms:</strong> Power BI, Tableau, Qlik, Thoughtspot`},
{c:6,t:'⭐ 4 Descriptive Analytics Tools (Essay)',p:2,b:`<strong>1. Data Mining:</strong> analyze data from various perspectives → patterns, correlations. <em>3 value categories:</em> a)Informed decisions b)Discover unknown patterns c)Automate processes. <strong>Affinity analysis</strong> = co-occurrence (Amazon: "also bought")<br><strong>2. Data Visualization:</strong> graphical format — easier to grasp. Heat maps = colors for intensity<br><strong>3. Digital Dashboards:</strong> real-time single-page KPI display. Must be: real-time, easy to read, drillable, interactive<br><strong>4. Mashups:</strong> combine data/apps from 2+ sources. Types: customer, logistics, HR mashups`},
{c:6,t:'Big Data & Advanced Analytics',p:1,b:`<strong>4 Vs:</strong> <span class="kt">Volume</span> huge · <span class="kt">Variety</span> structured+unstructured · <span class="kt">Velocity</span> speed · <span class="kt">Veracity</span> trustworthiness. 80-90% unstructured.<br><strong>Predictive:</strong> data+probabilities→forecast. Uses: data mining, regression, ML. Ex: Amazon recs, Sprint churn<br><strong>Prescriptive:</strong> suggests best action. Uses: optimization, ML, decision models<br><strong>Text Mining:</strong> unstructured text analysis. <strong>Sentiment Analysis:</strong> Natural Language Processing (NLP) for feelings/attitudes<br><strong>Geographic Information System (GIS):</strong> geographic data on maps. Geocoding=addresses→lat/long<br><strong>Machine Learning:</strong> learns patterns to predict/detect/categorize. <strong>Cognitive computing</strong> supports ML<br><strong>Data Science 7 stages:</strong> Capture→Store→Model→Analyze→Communicate→Deploy→Reiterate`},
,
// === CH7: SOCIAL MEDIA & SEMANTIC WEB ===
{c:7,t:'⭐ Web 2.0 & Social Media',p:2,b:`<strong>Web 2.0 (Social Web):</strong> dynamic webpages, UGC, mashup apps, broadband — users interact and share content.<br><strong>Social media:</strong> collection of web apps enabling sharing of info, ideas, and personal messages. Based on Web 2.0.<br><strong>8 Characteristics:</strong> UGC · Content control · Conversation · Community · Categorization/Tagging · Connections · Constant updating · Commercialization<br><strong>AJAX:</strong> makes webpages respond to user actions without full page reload<br><strong>Content marketing:</strong> strategic approach of creating/distributing content for a defined audience to drive profitable action`},
{c:7,t:'⭐ SNS & Social Commerce',p:2,b:`<strong>SNS (Social Networking Service):</strong> platform facilitating user profiles, connections, and communities<br><strong>Business uses of SNS:</strong> Selling goods · Promoting products · Prospecting customers · Building relationships · Listening to conversations · Soliciting ideas<br><strong>Private SNS:</strong> restricted to selected members — greater control, easier brand monitoring<br><strong>E-commerce 2.0:</strong> customers rate, review, and share purchases on social networks<br><strong>Social Commerce:</strong> wide range of strategies using tech platforms + social media to influence purchasing behavior and build customer relationships<br><strong>Social Engagement:</strong> employees interact via internet with customers, vendors, and partners`},
{c:7,t:'⭐ Search Engines & Enterprise Search',p:2,b:`<strong>Search engine:</strong> application for locating web pages or other content on a computer network<br><strong>How crawlers work:</strong> Spider downloads pages → Indexer creates index → Ranking module → Query interface for users<br><strong>Types:</strong> Crawler · Web directory · Hybrid · Meta-search · Semantic<br><strong>Enterprise search:</strong> <em>unlocking the value of information within an organization</em> — structured + unstructured data with access control<br><strong>SEO</strong> = designing webpage to satisfy search engine criteria (organic/free)<br><strong>SEM</strong> = paid strategy, PPC (Pay Per Click)<br><strong>Recommendation engine:</strong> presents info to users <em>without requiring active search</em> — anticipates useful info`},
{c:7,t:'⭐ Recommendation Engine Approaches',p:2,b:`<table class="tb"><tr><th>Approach</th><th>Based On</th><th>Example</th></tr><tr><td><strong>Content-based</strong></td><td>Product features from past interactions</td><td>"More like what you bought"</td></tr><tr><td><strong>Collaborative filtering</strong></td><td>Similarity to other users</td><td>"Users like you also bought"</td></tr><tr><td><strong>Knowledge-based</strong></td><td>User's stated needs</td><td>Spec-matching systems</td></tr><tr><td><strong>Demographic</strong></td><td>Age, gender, income etc.</td><td>Age-targeted suggestions</td></tr></table><strong>Hybrid:</strong> Weighted · Mixed · Cascade · Compound (combines approaches)`},
{c:7,t:'Semantic Web, Blogs & Wikis',p:1,b:`<strong>Semantic Web (Web 3.0):</strong> computers interpret meaning of content using metadata + NLP<br><strong>W3C languages:</strong> <span class="kt">RDF</span> · <span class="kt">OWL</span> · <span class="kt">SPARQL</span><br><strong>Metadata:</strong> info that describes other info<br><strong>Blog:</strong> online journal with entries in reverse chronological order. Platforms: WordPress, Blogger<br><strong>Microblog:</strong> frequent brief posts — Twitter most well-known; <strong>Tweet</strong> = 140-char message; <strong>Hashtag (#)</strong> links to a topic<br><strong>Wiki:</strong> collaborative content management app for teams to create/edit webpages (Wikipedia, MediaWiki)`},
{c:7,t:'Crowdsourcing, Crowdfunding & 5 Strategies',p:1,b:`<strong>Crowdsourcing:</strong> using a large group to solve problems or generate ideas<br><strong>Crowdfunding:</strong> raising money from many people to fund projects/ventures/causes<br><strong>5 Social Media Business Strategies:</strong> <span class="kt">Listen</span> · <span class="kt">Talk</span> · <span class="kt">Energize</span> · <span class="kt">Support</span> · <span class="kt">Embrace</span><br><strong>⚠️ TRICK:</strong> <em>Community</em> is a characteristic of social media — NOT one of the 5 strategies!<br><strong>Mashup:</strong> combines data/apps from 2+ sources into a new service (RSS provides data feeds)<br><strong>What is competitive advantage?</strong> An edge that enables a company to outperform its competitors`},
// === CH8: OMNICHANNEL, E-COMMERCE & M-COMMERCE ===
{c:8,t:'⭐ E-commerce, M-commerce & Omnichannel',p:2,b:`<strong>E-commerce:</strong> buying/selling goods and services on a computer network (Internet)<br><strong>M-commerce:</strong> buying/selling using mobile devices (smartphone, tablet) — uses NFC for payments/check-in<br><strong>Omnichannel retailing:</strong> seamless, integrated customer experience across multiple channels<br><strong>Showrooming:</strong> visit store to look/try products, then buy online cheaper<br><strong>Webrooming:</strong> research online, then purchase in a physical store<br><strong>Channel hopping:</strong> consumers purchase through various means — traditional, online, and mobile<br><strong>Pure play:</strong> retailer that only operates online (no physical channels)`},
{c:8,t:'⭐ Subscription-based Retailing Types',p:2,b:`<table class="tb"><tr><th>Type</th><th>What It Delivers</th><th>Examples</th></tr><tr><td><strong>Replenishment</strong></td><td>Essential, frequently-used products</td><td>Grocery, personal care boxes</td></tr><tr><td><strong>Curation</strong></td><td>Personalized product selection by preference</td><td>Clothing, beauty subscription boxes</td></tr><tr><td><strong>Access</strong></td><td>Access to services or special benefits</td><td>Free delivery, exclusive content</td></tr></table>Customers pay a <em>recurring fee</em> — provides steady revenue for businesses`},
{c:8,t:'Retail Logistics & Mobile Commerce',p:1,b:`<strong>Inbound logistics:</strong> movement of materials/goods INTO the organization from suppliers<br><strong>Outbound logistics:</strong> ready-to-ship items delivered to customers <em>quickly</em> and <em>carefully</em> to ensure undamaged<br><strong>Logistical infrastructure:</strong> organization of facilities, equipment, transportation for delivery<br><strong>FaaS (Fulfillment as a Service):</strong> outsource fulfillment operations to a third party<br><strong>BOPIS:</strong> Buy Online, Pick Up In Store<br><strong>NFC technology:</strong> enables mobile payment apps and check-in (NOT GPS — GPS is for location services)`},
// === CH9: FUNCTIONAL BUSINESS SYSTEMS ===
{c:9,t:'⭐ Functional Business Systems (FBS)',p:2,b:`<strong>FBS:</strong> IS designed to improve efficiency and performance of a <em>specific functional area</em> within an organization<br><strong>Functional silos:</strong> departments operating within their area of expertise independently<br><strong>Problem:</strong> fragmented roll-out created <em>data silos</em> — data trapped, not accessible by other IS or outside that department<br><strong>Cross-functional business system:</strong> integrates end-to-end activities <em>across departmental boundaries</em><br><strong>SOPs (Standard Operating Procedures):</strong> written instructions on how to perform a function — document data properties: security, quality, accuracy<br><strong>4 core processes (any org):</strong> Product/service development · Order generation · Order fulfillment · Customer service`},
{c:9,t:'⭐ 5 Functional Business Units',p:2,b:`<table class="tb"><tr><th>Unit</th><th>Responsible For</th></tr><tr><td><strong>Human Resources</strong></td><td>Hiring, training, evaluating, managing employees</td></tr><tr><td><strong>Finance & Accounting</strong></td><td>Budgeting, accounting, financial planning, compliance</td></tr><tr><td><strong>Sales & Marketing</strong></td><td>Customer needs, promotion, sales, brand awareness</td></tr><tr><td><strong>Production & Operations</strong></td><td>Producing goods, delivering services efficiently</td></tr><tr><td><strong>IT</strong></td><td>Systems, data, networks, digital processes</td></tr></table><strong>Income statement:</strong> best summarizes company's revenue and expenses for one quarter or full fiscal year`},
{c:9,t:'⭐ POM, JIT & Lean Manufacturing',p:2,b:`<strong>POM (Production & Operations Management):</strong> transforms inputs (capital, HR, equipment, IT) → outputs (goods/services)<br><table class="tb"><tr><th></th><th>JIT (Just-In-Time)</th><th>Lean Manufacturing</th></tr><tr><td><strong>Goal</strong></td><td>Minimize holding/inventory costs</td><td>Eliminate all waste</td></tr><tr><td><strong>How</strong></td><td>Take stock only when needed in production</td><td>Remove any step not adding value</td></tr><tr><td><strong>Requires</strong></td><td>Cooperative supply partners, frequent orders</td><td>Streamlined, efficient processes</td></tr></table><strong>JIT eliminates costs</strong> associated with carrying large inventories`},
{c:9,t:'CRM & Sales/Marketing Support Systems',p:1,b:`<strong>CRM (Customer Relationship Management):</strong> process of choosing most suitable approach to making/maintaining interactions with customers — stores data, tracks interactions, improves satisfaction/loyalty<br><strong>DSS:</strong> analyzes data for better sales/marketing decisions<br><strong>BI systems:</strong> analyze large data to identify patterns, trends, opportunities<br><strong>Data analytics:</strong> predictive analytics forecast customer behavior; prescriptive recommends actions<br><strong>Sales force automation (SFA):</strong> automates routine sales tasks (order processing, contact tracking)`},
// === CH10: ENTERPRISE SYSTEMS ===
{c:10,t:'⭐ ERP — Enterprise Resource Planning',p:2,b:`<strong>ERP:</strong> business process management software using <em>tightly integrated applications</em> to manage and automate business processes across the entire organization<br><strong>Central feature:</strong> shared database — all departments use ONE data source (eliminates data silos)<br><strong>How typically acquired:</strong> purchased · leased · or <span class="kt">SaaS</span> arrangement (exam answer: "purchasing or leasing in a SaaS arrangement")<br><strong>Top vendors:</strong> SAP and Oracle (largest two). <strong>VAR (Value-Added Reseller):</strong> customizes vendor software for specific industry needs<br><strong>Implementation challenge:</strong> complex — requires significant planning, training, and change management`},
{c:10,t:'⭐ Legacy Systems — 5 Reasons to Replace',p:2,b:`<strong>Legacy systems:</strong> older IS kept because they fulfill critical needs — but become increasingly difficult to maintain<br><strong>5 Reasons to replace:</strong><br>1. High maintenance costs — requires rare specialized skills<br>2. Integration obstacles — hardwired, predefined process flows block modern integration<br>3. Lack of qualified/trained staff — expertise in old tech becomes scarce<br>4. Cloud-based alternatives lower in cost<br>5. No longer support modern business requirements<br><strong>3 Migration triggers:</strong> 1)Changes in how people perform jobs 2)Redesign of business processes 3)Integration of uncoupled legacy systems`},
{c:10,t:'⭐ SCM — Supply Chain Management',p:2,b:`<strong>SCM:</strong> efficient management of the flows of material, data, and payments from suppliers to consumers<br><strong>3 Flows:</strong><br><span class="kt">Material flow</span> — goods movement from supplier to consumer<br><span class="kt">Information flow</span> — orders, inventory data, delivery status<br><span class="kt">Financial flow</span> — payments, credits, invoices<br><strong>Reverse supply chain:</strong> goods moving <em>back</em> from customer to supplier (returns, repairs)<br><strong>SCM functions:</strong> Inventory optimization · Warehouse management · Forecasting · Logistics · Supplier management`},
{c:10,t:'Enterprise Systems Overview',p:1,b:`<strong>Enterprise systems:</strong> large-scale application software supporting business processes, information flows, reporting, and analytics in complex organizations<br><strong>Core processes covered:</strong> accounting, finance, HR, operations, supply chain<br><strong>6 main types:</strong> ERP · SCM · CRM · HRM · E-procurement · Customer Analytics<br><strong>CRM (in enterprise):</strong> manages customer interactions and data across the entire organization<br><strong>Cross-functional integration:</strong> ERP connects all functional areas via shared database`},
// === CH11: ARTIFICIAL INTELLIGENCE, ROBOTICS & QUANTUM COMPUTING ===
{c:11,t:'⭐ AI Definition & 4 Stages',p:2,b:`<strong>AI:</strong> theory/development of computer systems performing tasks that normally require human intelligence (visual perception, speech recognition, decision-making, translation)<br><table class="tb"><tr><th>Stage</th><th>Description</th></tr><tr><td><strong>1. Rule-based</strong></td><td>Follows predefined rules; does NOT learn</td></tr><tr><td><strong>2. Machine Learning</strong></td><td>Learns from data; improves without explicit programming</td></tr><tr><td><strong>3. Deep Learning</strong></td><td>Neural networks; complex patterns; approximates human learning</td></tr><tr><td><strong>4. Intelligent/Cognitive</strong></td><td>Adapts, learns, and makes decisions independently</td></tr></table>`},
{c:11,t:'⭐ 6 Branches of AI',p:2,b:`<table class="tb"><tr><th>Branch</th><th>What It Does</th></tr><tr><td><strong>Machine Learning (ML)</strong></td><td>Learns from data, improves over time without explicit programming</td></tr><tr><td><strong>NLP</strong></td><td>Computers understand and generate human language</td></tr><tr><td><strong>Computer Vision</strong></td><td>Computers interpret and process visual input</td></tr><tr><td><strong>Expert Systems</strong></td><td>Knowledge-based, simulates human expertise in a domain</td></tr><tr><td><strong>Robotics</strong></td><td>Designs machines for complex automated physical actions</td></tr><tr><td><strong>Fuzzy Logic</strong></td><td>Handles "maybe" situations — not just yes/no binary</td></tr></table>`},
{c:11,t:'⭐ ML, Deep Learning & 4 AI Machine Types',p:2,b:`<strong>Machine Learning:</strong> learns from data, improves performance without explicit programming<br><strong>Deep Learning:</strong> uses neural networks; more complex; approximates human learning; powers image/speech recognition<br><strong>Cognitive computing:</strong> supports ML — simulates human thought<br><table class="tb"><tr><th>AI Machine Type</th><th>Description</th><th>Example</th></tr><tr><td>Reactive</td><td>No memory; current input only</td><td>Chess computer</td></tr><tr><td>Limited Memory</td><td>Uses past data for decisions</td><td>Self-driving cars</td></tr><tr><td>Theory of Mind</td><td>Understands emotions (future goal)</td><td>N/A</td></tr><tr><td>Self-Aware</td><td>Own consciousness (theoretical)</td><td>N/A</td></tr></table>`},
{c:11,t:'Robotics Types & AI Ethics',p:1,b:`<strong>4 Robot types:</strong><table class="tb"><tr><th>Type</th><th>Description</th></tr><tr><td><strong>Surgical</strong></td><td>Precise medical operations</td></tr><tr><td><strong>Collaborative</strong></td><td>Works alongside humans</td></tr><tr><td><strong>Drone</strong></td><td>Remotely controlled or autonomous via software, GPS, onboard sensors</td></tr><tr><td><strong>Service</strong></td><td>Customer-facing services</td></tr></table><strong>Work automation:</strong> replacing human workers with machines/technology<br><strong>Sentiment analysis:</strong> understanding consumer intent/opinions from social media and text<br><strong>3 AI ethical concerns:</strong> 1)Job loss 2)Privacy/civil rights violations 3)Systematic bias in ML algorithms`},
// === CH12: IT STRATEGY, SOURCING & COMPETITIVE ADVANTAGE ===
{c:12,t:'⭐ IT Strategy & Business-IT Alignment',p:2,b:`<strong>IT Strategy:</strong> plan of action to create IT capabilities for maximum and sustainable value — specifies financial requirements, budgets, and resources<br><strong>Business need:</strong> gap between current state and desired state<br><strong>Business driver:</strong> condition, process, or resource vital for the organization to thrive<br><strong>Business-IT Alignment:</strong> applying IT in appropriate and timely way consistent with business strategies, goals, and needs<br><strong>TOGAF:</strong> IT strategy tool to align IT goals with business goals — used by <em>60%+ of Fortune 500</em><br><strong>5 Alignment activities:</strong> 1)Understand business objectives 2)Communicate IT value 3)Build IT-business relationships 4)Connect IT plans to business 5)Measure IT value`},
{c:12,t:'⭐ Competitive Advantage & 3 Strategies',p:2,b:`<strong>Competitive advantage:</strong> an edge that enables a company to outperform competitors in ways that matter to customers<br><strong>3 Porter Strategies:</strong><br><span class="kt">Cost Leadership</span> — lowest cost in market (e.g., Walmart)<br><span class="kt">Differentiation</span> — unique, higher quality, or better service (e.g., Apple)<br><span class="kt">Focus</span> — target a specific market segment better than competitors<br><strong>Key IT components:</strong><br><span class="kt">Agility</span> = respond quickly to opportunities<br><span class="kt">Responsiveness</span> = scale IT up/down as needed (requires cloud)<br><span class="kt">Flexibility</span> = rapidly integrate new functions or reconfigure apps`},
{c:12,t:'IT Outsourcing & CIO Role',p:1,b:`<strong>IT Outsourcing:</strong> hiring external providers for IT functions instead of managing internally<br><strong>Benefits:</strong> Cost reduction · Access to expertise · Focus on core business · Flexibility/scalability<br><strong>Risk:</strong> Data security issues · Loss of control · Vendor dependency<br><strong>Offshore outsourcing:</strong> outsource to other countries using ICT for 24/7 communication<br><strong>CIO (Chief Information Officer):</strong> aligns IT strategy with business strategy<br><strong>4 CIO key skills:</strong> Business understanding · Communication · Strategic thinking · Leadership/Change management<br><strong>Comparative advantage:</strong> country produces goods/services more efficiently than trading partners`},
// === CH13: SYSTEMS DEVELOPMENT & PROJECT MANAGEMENT ===
{c:13,t:'⭐ Systems Development & SDLC 5 Stages',p:2,b:`<strong>Systems development:</strong> set of activities, methods, best practices, deliverables, automated tools for creating/maintaining IT architecture and software<br><strong>Business need:</strong> gap between current state and desired state<br><strong>Business driver:</strong> condition, process, or resource vital for the organization to thrive<br><table class="tb"><tr><th>Stage</th><th>Key Activities</th><th>Deliverable</th></tr><tr><td>1. Planning</td><td>Identify need, feasibility study</td><td>Project Plan</td></tr><tr><td>2. Analysis</td><td>Gather requirements, process models</td><td>Requirements Document</td></tr><tr><td>3. Design</td><td>UI, data, hardware/software specs</td><td>System Specifications</td></tr><tr><td>4. Implementation</td><td>Convert system, test</td><td>Operational System</td></tr><tr><td>5. Support/Maintenance</td><td>Audits, updates, user support</td><td>Updated System</td></tr></table>`},
{c:13,t:'⭐ Feasibility Types & Conversion Methods',p:2,b:`<strong>4 Feasibility Types (in Planning stage):</strong><br><span class="kt">Technical</span> — can the technology be developed/acquired?<br><span class="kt">Economic</span> — is it affordable and acceptable financial risk?<br><span class="kt">Operational</span> — will users accept and use it?<br><span class="kt">Schedule</span> — can it be completed in required time?<br><br><strong>4 System Conversion Methods:</strong><table class="tb"><tr><th>Method</th><th>Description</th><th>Risk</th></tr><tr><td>Plunge/Direct</td><td>Cut off old, start new at once</td><td>Highest</td></tr><tr><td>Parallel</td><td>Run both simultaneously</td><td>Lowest</td></tr><tr><td>Pilot</td><td>Test in one area, then roll out</td><td>Medium</td></tr><tr><td>Phased</td><td>Implement in stages</td><td>Medium-low</td></tr></table>`},
{c:13,t:'⭐ Software Development Methodologies',p:2,b:`<table class="tb"><tr><th>Methodology</th><th>Key Feature</th></tr><tr><td><strong>Waterfall</strong></td><td><em>"NO GOING BACK"</em> — sequential: each phase must be complete before next</td></tr><tr><td><strong>Agile</strong></td><td>Iterative, flexible, continuous improvement, adapts to change</td></tr><tr><td><strong>Object-Oriented (O-O)</strong></td><td>Modularity + reusability; objects encapsulate data + procedures</td></tr><tr><td><strong>DevOps</strong></td><td>Continuous development + operations integration; rapid deployment</td></tr></table><strong>⚠️ Waterfall = "NO GOING BACK"</strong> — the exam's trigger phrase for this methodology`},
{c:13,t:'Project Management & PM Role',p:1,b:`<strong>Project management:</strong> planning, organizing, and controlling resources to achieve specific goals within defined time and budget<br><strong>Project:</strong> temporary endeavor with a start, end, and specific objectives<br><strong>Project Manager's 5 responsibilities:</strong><br>1. <strong>Planning</strong> — tasks, schedules, budgets<br>2. <strong>Coordinating</strong> — team completes tasks on time<br>3. <strong>Communicating</strong> — progress to stakeholders<br>4. <strong>Risk management</strong> — identify problems, corrective action<br>5. <strong>Monitoring & controlling</strong> — keep project on track<br><strong>Project triangle:</strong> Scope · Time · Cost (change one, affects the others)`},
// === CH14: IT ETHICS & SUSTAINABILITY ===
{c:14,t:'⭐ Ethics & Code of Ethics',p:2,b:`<strong>Ethics:</strong> values and customs of a particular group identifying what is right and wrong<br><strong>Ethical behavior:</strong> acting in ways consistent with the accepted values of society and individuals<br><strong>Unethical behavior:</strong> action not considered morally right — consequences: fines, reputation damage, prison<br><strong>Code of ethics:</strong> set of principles and rules to govern decision-making and distinguish right from wrong<br><strong>2 purposes of code of ethics:</strong><br>1. Internal guide for employees on how to behave<br>2. External statement of organization's values and commitments`},
{c:14,t:'IT Ethics, SOX & Compliance',p:1,b:`<strong>IT ethics associations:</strong> AITP · PMI · SIM · AMIA<br><strong>Sarbanes-Oxley Act (SOX):</strong> mandates accurate business reporting and disclosure of violations<br><strong>SOX Section 302:</strong> CEO and CFO must verify that financial statements are accurate<br><strong>IT compliance:</strong> every person who works with IS should have specific assigned roles and clear accountability<br><strong>Ethics training:</strong> builds strong teams, fosters professionalism, increases productivity<br><strong>Enterprise ethics approach:</strong> combines risk, security, compliance, and IT specialists — starts at top leadership`},
{c:14,t:'Insider Fraud & Digital Ethics',p:1,b:`<strong>Insider fraud:</strong> criminal behavior perpetrated by organization's own employees or contractors — nonviolent crime using trickery to secure resources for personal gain<br><strong>Fraud prevention:</strong> system of policies and procedures to prevent and detect illegal acts by employees, customers, or partners<br><strong>Digital ethics issues:</strong> distracted driving (cell phones) · 3D printing concerns · AI bias and discrimination<br><strong>Unethical IT behavior examples:</strong> unauthorized data access · intellectual property theft · privacy violations · computer fraud`}
];

{c:1,t:'Q1. Discuss the seven disruptive digital business models and provide examples for each. (Ch1)',
model:`Disruptive business models use digital technology to change how companies make money. There are seven models:

1. Subscription — recurring payment for continued access (Netflix, Apple Music).
2. Freemium — basic version free, pay to upgrade (LinkedIn, Dropbox).
3. Free — customer is the product; revenue from ads/data (Google, Facebook).

{c:1,t:'Q2. List and explain the ten major IT management issues facing organizations today. (Ch1)',
model:`The ten major IT management issues facing organizations today are:

1. Security, Cybersecurity & Privacy — protecting data and systems from threats.
2. Technology Alignment with Business — ensuring IT supports business goals.
3. Data Analytics — using data to gain insights for better decisions.
4. Compliance & Regulations — meeting legal and industry requirements.
5. IT Cost Reduction & Controls — managing and lowering IT costs.
6. Business Cost Reduction & Controls — using tech to reduce operational costs.
7. Innovation — leveraging new tech for competitive advantage.
8. Digital Transformation — changing business processes through digital technology.
9. Business Agility & Flexibility — responding quickly to market changes.
10. IT Agility & Flexibility — adapting IT systems to new requirements rapidly.

These issues reflect that IT is now a core business driver, not just a support function.`,

{c:2,t:'Q3. Define Transaction Processing Systems (TPS). Explain internal vs external transactions and compare real-time vs batch processing with examples. (Ch2)',
model:`A TPS is an information system that collects, monitors, stores, processes, and distributes specific types of data input from ongoing transactions.

Two types of transactions:
- Internal: within the organization (payroll, budget transfers).
- External: from outside (customer purchases, supplier deliveries).

Two processing methods:
- Real-time (OLTP): processes each transaction immediately, e.g., airline seat booking. Current data but more expensive.
- Batch: collects transactions and processes them later (e.g., weekly payroll). Cheaper but data may be temporarily outdated.

TPS is critical — missing transactions cause lost sales, wrong financials, unhappy customers, and duplicate payments. TPS feeds data into higher systems: TPS → MIS → DSS → EIS.`,
check:['Defined TPS accurately','Explained internal vs external with examples','Compared OLTP vs batch with examples','Mentioned consequences of TPS failure','Mentioned TPS → MIS → DSS → EIS flow']},

{c:3,t:'Q4. Define a centralized database. Discuss its benefits and disadvantages. (Ch3)',
model:`A centralized database stores all data as a unified body in a single central computer (mainframe or server) in one physical location.

Benefits: 1) Better control of data quality 2) Ease of use 3) Better IT security 4) Better data integrity.

Disadvantages: 1) Transmission delay for distant users 2) Security risk — single point of failure 3) Reliability — if center fails, all fails 4) Difficult scalability as organization grows.

In contrast, a distributed database stores data on multiple computers via a network, offering better speed, reliability, and scalability, but at higher cost and network dependency.`,
check:['Defined centralized DB accurately','Listed all 4 benefits','Listed all 4 disadvantages','Mentioned single point of failure','Compared with distributed DB']},

{c:3,t:'Q5. What is effective data management? List and explain its six goals. (Ch3)',
model:`Effective data management oversees the end-to-end lifecycle of data from creation and initial storage to deletion when obsolete.

The six goals are:
1. Mitigating risks and costs of complying with regulations.
2. Ensuring legal requirements are met.
3. Safeguarding data security.
4. Maintaining accuracy of data and availability.
5. Certifying consistency in data from one or multiple locations.
6. Ensuring data conform to best practices for access, storage, backup, and disposal.

Benefits include: greater compliance, higher security, less legal liability, better sales/marketing strategy, improved product classification, and better governance with lower risk.`,
check:['Defined data management (lifecycle)','Listed all 6 goals','Explained each goal','Mentioned benefits']},

{c:4,t:'Q6. Define LAN and describe its three main configurations (Star, Ring, Bus). (Ch4)',
model:`A LAN is a group of computers and devices that share a communication line or wireless link within a limited geographic area (office, school, home).

Three configurations:
1. Star — each device links directly to a central hub. Most common. If hub fails, network fails; if one device fails, others work.
2. Ring — each computer connects to two neighbors forming a closed loop. If one fails, it can disrupt the whole ring.
3. Bus — one main channel with branches connected. Simple and cheap, but if the main cable fails, network stops.

LAN covers a limited area (one owner), while WAN covers large distances connecting multiple networks (e.g., the Internet).`,
check:['Defined LAN','Described Star clearly','Described Ring clearly','Described Bus clearly','Mentioned failure behavior','Compared LAN vs WAN']},

{c:5,t:'Q7. Define and give examples of intentional threats and unintentional threats to information systems. (Ch5)',
model:`INTENTIONAL THREATS — deliberate attacks:
- Hacking: unauthorized access. White hat (ethical), black hat (malicious), gray hat (mixed), hacktivist (cause-driven).
- Social Engineering: manipulating people via trust, curiosity, urgency, or fear.
- Phishing: fake emails to steal info. Spear phishing targets a specific group.
- Malware: virus (attaches to files), worm (self-replicates), trojan (disguised), ransomware (locks data for payment).
- DoS attacks: DDoS (distributed from multiple sources), TDoS (floods phone systems), PDoS (permanently damages hardware).
- Other: botnets, SQL injection, MitM (intercepting communications), insider threats, data tampering (false data — serious because may go undetected).

UNINTENTIONAL THREATS — three categories:
1. Human error: design mistakes, wrong data entry, default passwords, falling for phishing.
2. Environmental hazards: floods, fires, earthquakes, power failures, HVAC failures.
3. Computer system failures: poor manufacturing, defective materials, bad maintenance.`,
check:['Separated intentional from unintentional','Listed hacker types','Defined phishing/spear phishing','Listed malware types','Explained DDoS vs TDoS vs PDoS','Mentioned data tampering','Listed 3 unintentional categories with examples']},

{c:6,t:'Q8. Describe the four major descriptive data analytics tools and explain the business value of data mining. (Ch6)',
model:`Descriptive analytics create a summary of historical data to yield useful information. Four major tools:

1. Data Mining — using software to analyze data from various perspectives and derive correlations or patterns. Three value categories: a) more informed decisions, b) discovering unknown patterns, c) automating processes. Affinity analysis finds co-occurrence (e.g., Amazon: "customers who bought X also bought Y").

2. Data Visualization — presenting data graphically to help decision-makers grasp concepts and identify patterns. Heat maps use colors to show data intensity.

3. Digital Dashboards — static or interactive interface consolidating data across an organization. Shows real-time KPIs. Must be: easy to read, drillable, and interactive.

4. Mashups — combine data and applications from two or more sources into one view. Types: customer, logistics, HR mashups. Help nonexperts build complex queries.`,
check:['Defined descriptive analytics','Named all 4 tools','Defined data mining + 3 value categories','Mentioned affinity analysis with example','Defined visualization + heat maps','Defined dashboards + KPIs','Defined mashups with types']},
