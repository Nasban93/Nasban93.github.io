  function addOverlay(){
    var css = document.createElement("style");
    css.textContent = ".demo-overlay{position:fixed;inset:0;background:#f4f5f7;z-index:999999;display:flex;align-items:center;justify-content:center;font:600 15px/1.4 -apple-system,Segoe UI,sans-serif;color:#333;flex-direction:column;gap:10px}"
      + ".demo-overlay .dot{width:34px;height:34px;border-radius:50%;border:3px solid #cfd3da;border-top-color:#2563eb;animation:demoSpin .8s linear infinite}"
      + "@keyframes demoSpin{to{transform:rotate(360deg)}}"
      + ".demo-banner{position:fixed;top:0;left:0;right:0;z-index:999998;background:#111827;color:#fbbf24;font:600 12px/1 -apple-system,Segoe UI,sans-serif;text-align:center;padding:7px 10px;letter-spacing:.3px}"
      + "body.has-demo-banner{padding-top:30px !important}"
      + ".demo-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font:600 13px/1.3 -apple-system,Segoe UI,sans-serif;z-index:999997;box-shadow:0 6px 20px rgba(0,0,0,.25)}";
    document.head.appendChild(css);
    var ov = document.createElement("div");
    ov.className = "demo-overlay"; ov.id = "__demo_overlay";
    ov.innerHTML = '<div class="dot"></div><div>Loading demo…</div>';
    document.body.appendChild(ov);
  }
  function removeOverlay(){ var ov = document.getElementById("__demo_overlay"); if (ov) ov.remove(); }
  function addBanner(){
    var b = document.createElement("div");
    b.className = "demo-banner";
    b.textContent = "SYNTHETIC DEMO DATA — fictional guests & staff · binnasban.com";
    document.body.insertBefore(b, document.body.firstChild);
    document.body.classList.add("has-demo-banner");
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "demo-toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }
  document.addEventListener("DOMContentLoaded", function(){ addOverlay(); addBanner(); });

  function setNativeValue(el, value){
    var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
    var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
    setter.call(el, value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function waitFor(fn, timeoutMs){
    timeoutMs = timeoutMs || 15000;
    return new Promise(function(resolve, reject){
      var start = Date.now();
      (function poll(){
        var v = fn();
        if (v) return resolve(v);
        if (Date.now() - start > timeoutMs) return reject(new Error("waitFor timeout"));
        setTimeout(poll, 80);
      })();
    });
  }

  var DEMO_PASSWORD = "SynthDemo-2026!";
  var DEMO_PIN = "8146";

  async function run(){
    var pwInput = await waitFor(function(){ return document.querySelector('input[type="password"]'); });
    setNativeValue(pwInput, DEMO_PASSWORD);
    await wait(60);
    var form = pwInput.closest("form");
    if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));

    await waitFor(function(){ return document.querySelector(".pin-cells"); }, 15000);
    await wait(150);
    for (var i = 0; i < DEMO_PIN.length; i++) {
      var active = document.activeElement;
      if (active && active.tagName === "INPUT") { setNativeValue(active, DEMO_PIN[i]); }
      else { window.dispatchEvent(new KeyboardEvent("keydown", { key: DEMO_PIN[i], bubbles: true })); }
      await wait(90);
    }
    await wait(300);
    removeOverlay();
  }

  document.addEventListener("DOMContentLoaded", function(){
    run().catch(function(e){
      console.error("demo automation failed", e);
      removeOverlay();
      toast("Demo automation hit a snag — some views may need a manual click.");
    });
  });

  document.addEventListener("click", function(e){
    var el = e.target.closest && e.target.closest("button, [role=button], a.btn");
    if (!el) return;
    var txt = (el.textContent || "").toLowerCase();
    if (/save|delete|remove|approve|reject|reset|clear\\b|import|update|change password|add staff|manage staff|regenerate|deactivate|lock account|unlock account|check.?in|check.?out|log call/.test(txt)) {
      setTimeout(function(){ toast("Read-only demo — data resets on reload"); }, 60);
    }
  }, true);
})();

 counted as a 0.",components:[n=>`Coverage — courtesy/departure/desk coverage, scored only against the duty you were on this cycle (never both). Weight ${Math.round(n.wCoverage*100)}%.`,n=>`Detection (positive only) — valid cases logged per shift worked: ${n.detectionPerShiftThreshold} threshold → ${n.detectionPerShiftTarget} target → ${n.detectionPerShiftStretch} stretch, capped at ${n.detectionPerShiftCap}/shift. Weight ${Math.round(n.wDetection*100)}%.`,n=>`Recovery (positive only, claimer-based) — resolve time + % same-shift, floored at ${n.recoveryBaseline} so never claiming is never a penalty. Weight ${Math.round(n.wRecovery*100)}%.`,n=>`Follow-through — promised callbacks/traces completed by their due time: ${n.followThroughPctThreshold}% → ${n.followThroughPctTarget}% → ${n.followThroughPctStretch}%. Weight ${Math.round(n.wFollowThrough*100)}%.`],steps:["Upload today's Opera Arrivals export on the Arrivals tab, and the nightly gibyroom in-house export on In House — each guest moves through Arrival → In House → Departure automatically as these (and departure_all) land, or via the one-tap actions below.",'On Arrivals, tap "Check in" the moment a guest arrives — instant attribution, no typing. On Departure, tap Nice stay / Problem (High or Low) / Checked by physical check per guest — a Problem requires a short description and creates a case.',"Any agent can also log a recovery opportunity or note against a room/confirmation from an In House card, or start one directly from the Cases tab, and claim it as champion (owner) — or leave it unclaimed for someone else to pick up as team debt.","Work cases through Open → In Progress → Resolved (or Escalated if it needs a supervisor); add updates to a case's timeline as it progresses. Set a follow-up (owner + due time) when you promise a callback or trace, and mark it done once you deliver.","A supervisor/admin can void a junk or duplicate case from its detail panel — it stays visible and filterable, just excluded from Detection.","Use the OTA/Members/VIP/Flagged filter chips (on every list) to find what matters fast — they combine, and flagged/VIP guests always sort first.",'The Handover view is always the live truth — every non-Resolved case, grouped by champion. Click "Take handover snapshot" at shift change to record who was carrying what.',"Work the Courtesy Call list for in-house guests (5 quick questions) — it feeds coverage into the KPI.","Review the KPI view's scorecard; adjust thresholds/targets/weights in Settings as real data comes in — nothing is locked in. Supervisors/admins also see team debt, cause patterns and missed-detection flags there — for visibility only, never scored.","Back up regularly (sidebar) — data lives only in this browser unless you connect the shared PMS folder."],printHint:"This page is printable — use your browser's Print to hand out a one-page SOP."},ar:{langLabel:"العربية",whatIsTitle:"ما الذي تقوم به رعاية النزلاء",whatIsBody:"أداة تشغيلية محورها الضيف، مبنية حول دورة إقامة الضيف — الوصول، الإقامة الحالية، المغادرة — مصدرها رفعات أوبيرا (الوصول / gibyroom / departure_all). كل تسجيل وصول ونتيجة مغادرة وفرصة استرداد واتصال مجاملة وحالة تُنسب إلى الموظف الذي سجّلها، وتُغذّي مؤشر معالجة وإرضاء النزيل (04).",howCountsTitle:"كيف تُحتسب نتيجة معالجة وإرضاء النزيل",howUseTitle:"طريقة الاستخدام",legendTitle:"دليل الحالات",good:"جيد",watch:"مراقبة",poor:"يحتاج انتباه",standardNote:"التبليغ يفوز دائماً: تسجيل فرصة استرداد لا يمكن أبداً أن يخفّض نتيجتك. التغطية والاكتشاف والاسترداد عناصر إيجابية فقط — الاكتشاف يحتسب كل حالة صحيحة تُسجّلها (أي شدة، أي سبب، حتى نزيل غير راضٍ لم تُحل مشكلته)؛ الاسترداد يرفع نتيجتك فوق حدّها الأدنى فقط عند تولّي الحالة وحلّها، وعدم تولّي أي حالة يُبقيك عند هذا الحد دون أي عقوبة. يتبع هذا معيار التقييم الموحّد لكامل النظام (KPI-STANDARD.md): كل عنصر يُحتسب عبر حد أدنى ← هدف ← تفوّق، ويُطبَّع إلى 0–100 ثم يُدمج بالوزن ضمن نتيجة نهائية واحدة. أي عنصر لا توجد له بيانات هذه الدورة (مثل موظف لم يكن مكلَّفاً بعمل الاستقبال) يُستثنى ببساطة من متوسطه الموزون، ولا يُحتسب كصفر.",components:[n=>`التغطية — تغطية المجاملة/المغادرة/الاستقبال، تُحتسب فقط مقابل المهمة التي كُلِّفت بها هذه الدورة. الوزن ${Math.round(n.wCoverage*100)}%.`,n=>`الاكتشاف (إيجابي فقط) — الحالات الصحيحة المسجَّلة لكل مناوبة عمل: حد أدنى ${n.detectionPerShiftThreshold} ← هدف ${n.detectionPerShiftTarget} ← تفوّق ${n.detectionPerShiftStretch}، بحد أقصى ${n.detectionPerShiftCap} لكل مناوبة. الوزن ${Math.round(n.wDetection*100)}%.`,n=>`الاسترداد (إيجابي فقط، حسب المتولّي) — وقت الحل + % نفس المناوبة، بحدّ أدنى ${n.recoveryBaseline} حتى لا يكون عدم التولّي عقوبة أبداً. الوزن ${Math.round(n.wRecovery*100)}%.`,n=>`المتابعة — الوعود (اتصالات/متابعات) المكتملة قبل موعدها: ${n.followThroughPctThreshold}% ← ${n.followThroughPctTarget}% ← ${n.followThroughPctStretch}%. الوزن ${Math.round(n.wFollowThrough*100)}%.`],steps:["ارفع تقرير وصول اليوم من أوبيرا في تبويب الوصول، ورفعة gibyroom الليلية في تبويب الإقامة الحالية — ينتقل كل نزيل تلقائياً عبر الوصول ← الإقامة الحالية ← المغادرة مع وصول هذه الملفات (و departure_all)، أو عبر الإجراءات السريعة أدناه.",'في تبويب الوصول، اضغط "تسجيل الوصول" فور وصول النزيل — نسبة فورية دون كتابة. في المغادرة، اضغط إقامة سعيدة / مشكلة (عالية أو منخفضة) / تحقّق ميداني لكل نزيل — المشكلة تتطلب وصفاً مختصراً وتُنشئ حالة.',"يمكن لأي موظف أيضاً تسجيل فرصة استرداد أو ملاحظة على غرفة/تأكيد من بطاقة في الإقامة الحالية، أو بدء حالة مباشرة من تبويب الحالات، وتولّيها كمسؤول (champion) — أو تركها لغيره كحالة معلّقة للفريق.","انقل الحالات عبر: مفتوح ← قيد التنفيذ ← تم الحل (أو تصعيد إن احتاجت مشرفاً)؛ أضف تحديثات إلى الجدول الزمني للحالة مع تقدّمها. حدّد متابعة (مسؤول + موعد) عند الوعد باتصال أو تتبّع، وضعها كمكتملة عند التنفيذ.","يمكن للمشرف/المسؤول إلغاء حالة مكرّرة أو عشوائية من لوحة تفاصيلها — تبقى ظاهرة وقابلة للتصفية، وتُستثنى فقط من الاكتشاف.","استخدم رقائق التصفية (وكالات حجز / أعضاء / كبار الشخصيات / مُعلَّم) في كل قائمة لإيجاد ما يهم بسرعة — تتراكب معاً، والنزلاء المُعلَّمون وكبار الشخصيات يُعرضون أولاً دائماً.",
