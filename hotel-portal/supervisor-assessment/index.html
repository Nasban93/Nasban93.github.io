  var WELCOME_KEY = "demo-welcome-seen-v1";
  var welcomeShown = false;
  function demoGoTo(label){
    var items = document.querySelectorAll(".nav-item-label");

    title: "Supervisor Assessment (LQA-style)",

    tries: [

  function welcomeSeen(){ try { return localStorage.getItem(WELCOME_KEY) === "1"; } catch(e){ return false; } }

    }
    var bulletsHtml = "";
    for (var j = 0; j < WELCOME.bullets.length; j++) { bulletsHtml += "<li>" + WELCOME.bullets[j] + "</li>"; }
    bd.innerHTML =

      if (e.key === "Escape" && document.getElementById("__demo_welcome")) {
        dismissWelcome();
        document.removeEventListener("keydown", escHandler);
      }
    });
    var tryBtns = bd.querySelectorAll(".dw-try");

      tryBtns[k].addEventListener("click", function(e){
        var idx = parseInt(e.currentTarget.getAttribute("data-i"), 10);
        dismissWelcome();
        setTimeout(function(){ WELCOME.tries[idx].action(); }, 200);
      });
    }
  }
  function maybeShowWelcome(){
    if (welcomeShown) return;
    if (welcomeSeen()) return;

  document.addEventListener("DOMContentLoaded", function(){ addOverlay(); addBanner(); });

  function setNativeValue(el, value){
    var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
    var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
    setter.call(el, value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function waitFor(fn, timeoutMs){
    timeoutMs = timeoutMs || 15000;
    return new Promise(function(resolve, reject){
      var start = Date.now();
      (function poll(){
        var v = fn();
        if (v) return resolve(v);
        if (Date.now() - start > timeoutMs) return reject(new Error("waitFor timeout"));
        setTimeout(poll, 80);
      })();
    });
  }

  var DEMO_PASSWORD = "SynthDemo-2026!";
  var DEMO_PIN = "5927";

  async function run(){
    var pwInput = await waitFor(function(){ return document.querySelector('input[type="password"]'); });
    setNativeValue(pwInput, DEMO_PASSWORD);
    await wait(60);
    var form = pwInput.closest("form");
    if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));

    await waitFor(function(){ return document.querySelector(".pin-cells"); }, 15000);
    await wait(150);
    for (var i = 0; i < DEMO_PIN.length; i++) {
      var active = document.activeElement;
      if (active && active.tagName === "INPUT") { setNativeValue(active, DEMO_PIN[i]); }
      else { window.dispatchEvent(new KeyboardEvent("keydown", { key: DEMO_PIN[i], bubbles: true })); }
      await wait(90);
    }
    await wait(300);
    removeOverlay();
    maybeShowWelcome();
  }

  document.addEventListener("DOMContentLoaded", function(){
    run().catch(function(e){
      console.error("demo automation failed", e);
      removeOverlay();
      toast("Demo automation hit a snag — some views may need a manual click.");
      maybeShowWelcome();
    });

  document.addEventListener("click", function(e){
    var el = e.target.closest && e.target.closest("button, [role=button], a.btn");

      setTimeout(function(){ toast("Read-only demo — data resets on reload"); }, 60);
    }
  }, true);
})();

<script id="demo-mobile-js">
(function(){
  function classifyAndLabel(){
    var tables = document.querySelectorAll("table");
    for (var i=0;i<tables.length;i++){
      var table = tables[i];
      var thead = table.querySelector("thead");
      var tbody = table.querySelector("tbody");
      if (!thead || !tbody) continue;
      var headerRow = thead.querySelector("tr");
      if (!headerRow) continue;
      var headers = Array.prototype.map.call(headerRow.children, function(th){
        return th.textContent.replace(/[▾▴]/g,"").trim();
      });
      var dayRe = /^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\b/i;
      var dayMatches = 0;
      for (var k=0;k<headers.length;k++){ if (dayRe.test(headers[k])) dayMatches++; }
      var isMatrix = table.className.indexOf("roster-grid") !== -1 || dayMatches >= 3;
      if (isMatrix) {
        table.setAttribute("data-mobile-mode","scroll");
        var p = table.parentNode;
        if (!(p && p.classList && p.classList.contains("demo-mobile-scrollwrap"))) {
          var wrap = document.createElement("div");
          wrap.className = "demo-mobile-scrollwrap";
          p.insertBefore(wrap, table);
          wrap.appendChild(table);
        }
        continue;
      }
      table.setAttribute("data-mobile-mode","cards");
      var titleIdx = -1;
      for (var h=0; h<headers.length; h++){ if (/name|agent|guest|staff|assessment|topic|room/i.test(headers[h])) { titleIdx = h; break; } }
      if (titleIdx === -1) { for (var h2=0; h2<headers.length; h2++){ if (headers[h2].length>0) { titleIdx = h2; break; } } }
      if (titleIdx === -1) titleIdx = 0;
      var rows = tbody.querySelectorAll("tr");
      for (var r=0; r<rows.length; r++){
        var cells = rows[r].children;
        for (var c=0;c<cells.length;c++){
          var cell = cells[c];
          cell.removeAttribute("data-label");
          cell.removeAttribute("data-card-title");
          cell.removeAttribute("data-card-actions");
          if (c === titleIdx) { cell.setAttribute("data-card-title",""); }
          else if (headers[c] && headers[c].length>0) { cell.setAttribute("data-label", headers[c]); }
          else { cell.setAttribute("data-card-actions",""); }
        }
      }
    }
  }
  function schedule(){
    clearTimeout(window.__demoMobileT);
    window.__demoMobileT = setTimeout(classifyAndLabel, 120);
  }
  function __start(){
    schedule();
    try {
      var mo = new MutationObserver(schedule);
      mo.observe(document.body, {childList:true, subtree:true});
    } catch(e){}
    window.addEventListener("resize", schedule);
  }
  if (document.body) { __start(); } else { document.addEventListener("DOMContentLoaded", __start); }
})();
</script>
