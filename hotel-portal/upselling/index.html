      + ".demo-welcome-card .dw-bullets{margin:0;padding-left:18px;color:#555555}"
      + ".demo-welcome-card .dw-bullets li{margin:0 0 6px}"
      + ".demo-welcome-card .dw-tries{display:flex;flex-direction:column;gap:6px}"
      + ".demo-welcome-card .dw-try{text-align:left;background:rgba(200,164,93,.08);border:1px solid rgba(200,164,93,.3);color:#1a1a1a;border-radius:8px;padding:8px 10px;font:600 12.5px/1.35 -apple-system,Segoe UI,sans-serif;cursor:pointer;transition:background .15s,border-color .15s}"
      + ".demo-welcome-card .dw-try:hover{background:rgba(200,164,93,.18);border-color:#c8a45d}"

      + ".demo-welcome-card .dw-cta:hover{background:#dcb974}"
      + "@media (max-width:480px){.demo-welcome-card{padding:18px 16px 16px;max-height:calc(100vh - 24px)}.demo-welcome-card .dw-title{font-size:16px}}"
      + ".demo-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#ffffff;color:#1a1a1a;border:1px solid rgba(200,164,93,.4);padding:10px 16px;border-radius:8px;font:600 13px/1.3 -apple-system,Segoe UI,sans-serif;z-index:999997;box-shadow:0 6px 20px rgba(0,0,0,.08)}.ds-mobile-menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;min-width:40px;border-radius:8px;background:rgba(200,164,93,.08);border:1px solid #eaeaea;color:#1a1a1a;font-size:18px;cursor:pointer;flex:0 0 auto;margin-right:2px;padding:0}.ds-mobile-menu-btn:hover{border-color:#c8a45d;background:rgba(200,164,93,.18)}@media (max-width:900px){.ds-mobile-menu-btn{display:flex}.sidebar{display:flex!important;position:fixed!important;top:var(--ds-shell-h,40px);left:0;height:calc(100vh - var(--ds-shell-h,40px));z-index:999990;transform:translateX(-101%);transition:transform .22s ease;box-shadow:2px 0 24px rgba(0,0,0,.28)}.sidebar.demo-mobile-open{transform:translateX(0)!important}.demo-mobile-backdrop{position:fixed;inset:0;top:var(--ds-shell-h,40px);background:rgba(10,10,10,.4);z-index:999988;opacity:0;pointer-events:none;transition:opacity .18s ease}.demo-mobile-backdrop.show{opacity:1;pointer-events:auto}}";
    document.head.appendChild(css);
    var ov = document.createElement("div");
    ov.className = "demo-overlay"; ov.id = "__demo_overlay";
    ov.innerHTML = '<div class="dot"></div><div>Loading demo…</div>';
    document.body.appendChild(ov);
  }
  function removeOverlay(){ var ov = document.getElementById("__demo_overlay"); if (ov) ov.remove(); }
  var DEMO_APPS = [
    { id: "performance", href: "../performance/", label: "Performance" },
    { id: "attendance", href: "../attendance/", label: "Attendance" },
    { id: "nightAudit", href: "../night-audit/", label: "Night Audit" },
    { id: "upselling", href: "../upselling/", label: "Upselling & Enrollment" },
    { id: "guestPortal", href: "../guest-care/", label: "Guest Care" },
    { id: "supervisorAssessment", href: "../supervisor-assessment/", label: "Supervisor Assessment" }
  ];
  function addBanner(){
    var current = null;
    for (var i = 0; i < DEMO_APPS.length; i++) { if (DEMO_APPS[i].id === APP_ID) current = DEMO_APPS[i]; }
    var menuHtml = "";
    for (var j = 0; j < DEMO_APPS.length; j++) {
      var a = DEMO_APPS[j];
      if (a.id === APP_ID) {
        menuHtml += '<span class="ds-cur">' + a.label + ' <span class="ds-check">✓</span></span>';
      } else {
        menuHtml += '<a href="' + a.href + '">' + a.label + '</a>';
      }
    }
    var b = document.createElement("div");
    b.className = "demo-shell";
    b.innerHTML =
      '<button type="button" class="ds-mobile-menu-btn" id="__ds_mobile_menu_btn" aria-label="Open navigation menu" aria-expanded="false" title="Menu">☰</button><a class="ds-home" href="../" title="Back to the FO Portal hub"><span class="ds-home-icon">⌂</span><span class="ds-home-label"> FO Portal demo</span></a>' +
      '<div class="ds-right">' +
        '<div class="ds-switch-wrap">' +
          '<button type="button" class="ds-switch-btn" id="__ds_switch_btn" aria-haspopup="true" aria-expanded="false"><span class="ds-cur-label">' + (current ? current.label : "Switch app") + '</span><span class="ds-caret">▾</span></button>' +
          '<div class="ds-switch-menu" id="__ds_switch_menu" hidden>' + menuHtml + '</div>' +
        '</div>' +
        '<div class="ds-notice" title="SYNTHETIC DEMO DATA — fictional guests &amp; staff · binnasban.com">SYNTHETIC DEMO DATA — fictional guests &amp; staff</div>' +
        '<button type="button" class="ds-help-btn" id="__ds_help_btn" title="What am I looking at?" aria-label="What am I looking at? Reopen the welcome card">?</button>' +
      '</div>';
    document.body.insertBefore(b, document.body.firstChild);
    document.body.classList.add("has-demo-banner");
    var __mmBtn = document.getElementById("__ds_mobile_menu_btn");
    var __mmBackdrop = document.createElement("div");
    __mmBackdrop.className = "demo-mobile-backdrop";
    __mmBackdrop.id = "__ds_mobile_backdrop";
    document.body.appendChild(__mmBackdrop);
    function __closeMobileNav(){
      var sb = document.querySelector(".sidebar");
      if (sb) sb.classList.remove("demo-mobile-open");
      __mmBackdrop.classList.remove("show");
      if (__mmBtn) __mmBtn.setAttribute("aria-expanded","false");
    }
    function __openMobileNav(){
      var sb = document.querySelector(".sidebar");
      if (sb) sb.classList.add("demo-mobile-open");
      __mmBackdrop.classList.add("show");
      if (__mmBtn) __mmBtn.setAttribute("aria-expanded","true");
    }
    if (__mmBtn) __mmBtn.addEventListener("click", function(){
      var sb = document.querySelector(".sidebar");
      if (sb && sb.classList.contains("demo-mobile-open")) { __closeMobileNav(); } else { __openMobileNav(); }
    });
    __mmBackdrop.addEventListener("click", __closeMobileNav);
    document.addEventListener("click", function(e){
      var sb = document.querySelector(".sidebar");
      if (sb && sb.classList.contains("demo-mobile-open") && e.target && e.target.closest && e.target.closest(".nav-item")) {
        setTimeout(__closeMobileNav, 150);
      }
    }, true);

    function sizeBody(){ var h = b.offsetHeight; document.body.style.paddingTop = h + "px"; document.documentElement.style.setProperty("--ds-shell-h", h + "px"); }
    sizeBody();
    window.addEventListener("resize", sizeBody);
    var btn = document.getElementById("__ds_switch_btn");
    var menu = document.getElementById("__ds_switch_menu");
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var willOpen = menu.hidden;
      menu.hidden = !willOpen;
      btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    });
    document.addEventListener("click", function(e){
      if (!menu.hidden && e.target !== btn && !menu.contains(e.target)) {
        menu.hidden = true;
        btn.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && !menu.hidden) {
        menu.hidden = true;
        btn.setAttribute("aria-expanded", "false");
      }
    });
    var helpBtn = document.getElementById("__ds_help_btn");
    if (helpBtn) helpBtn.addEventListener("click", function(){ showWelcome(); });
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "demo-toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }

  // ── First-visit KPI welcome card (v3) ──
  var WELCOME_KEY = "demo-welcome-seen-v1";
  var welcomeShown = false;
  function demoGoTo(label){
    var items = document.querySelectorAll(".nav-item-label");
    for (var i = 0; i < items.length; i++) {
      if (items[i].textContent.trim() === label) {
        var it = items[i].closest(".nav-item");
        if (it) { it.click(); return true; }
      }
    }
    return false;
  }

  var WELCOME = {
    eyebrow: "KPI 03 + 06 · COMMERCIAL",
    title: "Upselling & Membership Enrollment",
    intro: "Two commercial KPIs on one screen: how much extra revenue agents upsell above target, and what share of eligible guests they enroll in the loyalty program.",
    bullets: [
      "Upselling = revenue generated ÷ this cycle's revenue target.",
      "Enrollment = valid, active enrollments ÷ eligible check-ins (non-members only — a sign-up only counts once it's active).",
      "Both scored 0–100 on the same threshold → target → stretch scale; the leaderboard rank is for display only, never part of the score."
    ],
    tries: [
      { label: "Open Leaderboard — see who's converting best", action: function(){ demoGoTo("Leaderboard"); } },
      { label: "Open Upselling — revenue vs. target per agent", action: function(){ demoGoTo("Upselling"); } },
      { label: "Open Membership Enrollment — capture rate per agent", action: function(){ demoGoTo("Membership Enrollment"); } }
    ]
  };
  function welcomeSeen(){ try { return localStorage.getItem(WELCOME_KEY) === "1"; } catch(e){ return false; } }
  function markWelcomeSeen(){ try { localStorage.setItem(WELCOME_KEY, "1"); } catch(e){} }
  function closeWelcome(){
    var bd = document.getElementById("__demo_welcome");
    if (bd) bd.remove();
  }
  function dismissWelcome(){ markWelcomeSeen(); closeWelcome(); }
  function showWelcome(){
    closeWelcome();
    var bd = document.createElement("div");
    bd.id = "__demo_welcome";
    bd.className = "demo-welcome-backdrop";
    var triesHtml = "";
    for (var i = 0; i < WELCOME.tries.length; i++) {
      triesHtml += '<button type="button" class="dw-try" data-i="' + i + '">' + WELCOME.tries[i].label + '</button>';
    }
    var bulletsHtml = "";
    for (var j = 0; j < WELCOME.bullets.length; j++) { bulletsHtml += "<li>" + WELCOME.bullets[j] + "</li>"; }
    bd.innerHTML =
      '<div class="demo-welcome-card" role="dialog" aria-modal="true" aria-labelledby="__dw_title">' +
        '<button type="button" class="dw-x" aria-label="Close">\u2715</button>' +
        '<div class="dw-eyebrow">' + WELCOME.eyebrow + '</div>' +
        '<div class="dw-title" id="__dw_title">' + WELCOME.title + '</div>' +
        '<p class="dw-intro">' + WELCOME.intro + '</p>' +
        '<div class="dw-h">How the score is computed</div>' +
        '<ul class="dw-bullets">' + bulletsHtml + '</ul>' +
        '<div class="dw-h">Try this</div>' +
        '<div class="dw-tries">' + triesHtml + '</div>' +
        '<button type="button" class="dw-cta">Got it — explore</button>' +
      '</div>';
    document.body.appendChild(bd);
    bd.querySelector(".dw-x").addEventListener("click", dismissWelcome);
    bd.querySelector(".dw-cta").addEventListener("click", dismissWelcome);
    bd.addEventListener("mousedown", function(e){ if (e.target === bd) dismissWelcome(); });
    document.addEventListener("keydown", function escHandler(e){
      if (e.key === "Escape" && document.getElementById("__demo_welcome")) {
        dismissWelcome();
        document.removeEventListener("keydown", escHandler);
      }
    });
    var tryBtns = bd.querySelectorAll(".dw-try");
    for (var k = 0; k < tryBtns.length; k++) {
      tryBtns[k].addEventListener("click", function(e){
        var idx = parseInt(e.currentTarget.getAttribute("data-i"), 10);
        dismissWelcome();
        setTimeout(function(){ WELCOME.tries[idx].action(); }, 200);
      });
    }
  }
  function maybeShowWelcome(){
    if (welcomeShown) return;
    if (welcomeSeen()) return;
    welcomeShown = true;
    setTimeout(showWelcome, 450);
  }

  document.addEventListener("DOMContentLoaded", function(){ addOverlay(); addBanner(); });

  function setNativeValue(el, value){
    var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
    var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
    setter.call(el, value);
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function waitFor(fn, timeoutMs){
    timeoutMs = timeoutMs || 15000;
    return new Promise(function(resolve, reject){
      var start = Date.now();
      (function poll(){
        var v = fn();
        if (v) return resolve(v);
        if (Date.now() - start > timeoutMs) return reject(new Error("waitFor timeout"));
        setTimeout(poll, 80);
      })();
    });
  }

  var DEMO_PASSWORD = "SynthDemo-2026!";
  var DEMO_PIN = "4058";

  async function run(){
    var pwInput = await waitFor(function(){ return document.querySelector('input[type="password"]'); });
    setNativeValue(pwInput, DEMO_PASSWORD);
    await wait(60);
    var form = pwInput.closest("form");
    if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));

    await waitFor(function(){ return document.querySelector(".pin-cells"); }, 15000);
    await wait(150);
    for (var i = 0; i < DEMO_PIN.length; i++) {
      var active = document.activeElement;
      if (active && active.tagName === "INPUT") { setNativeValue(active, DEMO_PIN[i]); }
      else { window.dispatchEvent(new KeyboardEvent("keydown", { key: DEMO_PIN[i], bubbles: true })); }
      await wait(90);
    }

    var dashTab = await waitFor(function(){
      var items = document.querySelectorAll(".nav-item-label");
      for (var i = 0; i < items.length; i++) if (items[i].textContent.trim() === "Dashboard") return items[i].closest(".nav-item");
      return null;
    }, 15000);
    dashTab.click();
    await wait(200);

    removeOverlay();
    maybeShowWelcome();
  }

  document.addEventListener("DOMContentLoaded", function(){
    run().catch(function(e){
      console.error("demo automation failed", e);
      removeOverlay();
      toast("Demo automation hit a snag — some views may need a manual click.");
      maybeShowWelcome();
    });
  });

  document.addEventListener("click", function(e){
    var el = e.target.closest && e.target.closest("button, [role=button], a.btn");
    if (!el) return;
    var txt = (el.textContent || "").toLowerCase();
    if (/save|delete|remove|approve|reject|reset|clear\\b|import|update|change password|add staff|manage staff|regenerate|deactivate|lock account|unlock account/.test(txt)) {
      setTimeout(function(){ toast("Read-only demo — data resets on reload"); }, 60);
    }
  }, true);
})();

<script id="demo-mobile-js">
(function(){
  function classifyAndLabel(){
    var tables = document.querySelectorAll("table");
    for (var i=0;i<tables.length;i++){
      var table = tables[i];
      var thead = table.querySelector("thead");
      var tbody = table.querySelector("tbody");
      if (!thead || !tbody) continue;
      var headerRow = thead.querySelector("tr");
      if (!headerRow) continue;
      var headers = Array.prototype.map.call(headerRow.children, function(th){
        return th.textContent.replace(/[▾▴]/g,"").trim();
      });
      var dayRe = /^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\b/i;
      var dayMatches = 0;
      for (var k=0;k<headers.length;k++){ if (dayRe.test(headers[k])) dayMatches++; }
      var isMatrix = table.className.indexOf("roster-grid") !== -1 || dayMatches >= 3;
      if (isMatrix) {
        table.setAttribute("data-mobile-mode","scroll");
        var p = table.parentNode;
        if (!(p && p.classList && p.classList.contains("demo-mobile-scrollwrap"))) {
          var wrap = document.createElement("div");
          wrap.className = "demo-mobile-scrollwrap";
          p.insertBefore(wrap, table);
          wrap.appendChild(table);
        }
        continue;
      }
      table.setAttribute("data-mobile-mode","cards");
      var titleIdx = -1;
      for (var h=0; h<headers.length; h++){ if (/name|agent|guest|staff|assessment|topic|room/i.test(headers[h])) { titleIdx = h; break; } }
      if (titleIdx === -1) { for (var h2=0; h2<headers.length; h2++){ if (headers[h2].length>0) { titleIdx = h2; break; } } }
      if (titleIdx === -1) titleIdx = 0;
      var rows = tbody.querySelectorAll("tr");
      for (var r=0; r<rows.length; r++){
        var cells = rows[r].children;
        for (var c=0;c<cells.length;c++){
          var cell = cells[c];
          cell.removeAttribute("data-label");
          cell.removeAttribute("data-card-title");
          cell.removeAttribute("data-card-actions");
          if (c === titleIdx) { cell.setAttribute("data-card-title",""); }
          else if (headers[c] && headers[c].length>0) { cell.setAttribute("data-label", headers[c]); }
          else { cell.setAttribute("data-card-actions",""); }
        }
      }
    }
  }
  function schedule(){
    clearTimeout(window.__demoMobileT);
    window.__demoMobileT = setTimeout(classifyAndLabel, 120);
  }
  function __start(){
    schedule();
    try {
      var mo = new MutationObserver(schedule);
      mo.observe(document.body, {childList:true, subtree:true});
    } catch(e){}
    window.addEventListener("resize", schedule);
  }
  if (document.body) { __start(); } else { document.addEventListener("DOMContentLoaded", __start); }
})();
</script>
