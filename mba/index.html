<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBA Executive Knowledge Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* CSS Variables & Theme */
:root { --bg: #F7F5F0; --bg-sidebar: #FFFFFF; --bg-card: #FFFFFF; --bg-hover: #F0EDE6; --bg-active: #1a3a5f; --text-primary: #1A1A2E; --text-secondary: #5C5C72; --text-muted: #9898A8; --text-on-active: #FFFFFF; --accent: #1a5f7a; --accent-soft: #e1edf2; --border: #E4E0D8; --radius: 10px; --font-serif: 'Lora', serif; --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace; }
[data-theme="dark"] { --bg: #111118; --bg-sidebar: #18181F; --bg-card: #1E1E28; --bg-hover: #26263A; --bg-active: #4e9fb8; --text-primary: #EEEEF5; --text-secondary: #A0A0B8; --text-muted: #60607A; --text-on-active: #111118; --accent: #5cbcd9; --accent-soft: #1d2c33; --border: #2A2A38; }

/* Base & Layout */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
button { cursor: pointer; border: none; background: none; }

/* Sidebar */
#sidebar { width: 300px; min-width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border); }
.brand-title { font-family: var(--font-serif); font-size: 20px; font-weight: 700; }
.search-box { padding: 15px; border-bottom: 1px solid var(--border); }
#searchInput { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); font-size: 14px; outline: none; }
#sidebarNav { flex: 1; overflow-y: auto; padding: 15px 0; }
.nav-item { padding: 10px 20px; font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; transition: 0.2s; cursor: pointer; }
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--bg-active); color: var(--text-on-active); }
.nav-badge { font-size: 10px; font-family: var(--font-mono); background: var(--accent-soft); color: var(--accent); padding: 2px 6px; border-radius: 4px; }

/* Main Content */
#main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
#topbar { padding: 0 40px; height: 60px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.theme-toggle { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-muted); }

#readingPane { padding: 40px 60px; max-width: 900px; margin: 0 auto; width: 100%; }
.course-header { margin-bottom: 40px; }
.course-tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.course-title { font-family: var(--font-serif); font-size: 36px; font-weight: 700; margin: 10px 0; }
.course-desc { color: var(--text-secondary); font-size: 16px; line-height: 1.6; margin-bottom: 20px; }

.chapter { margin-bottom: 60px; }
.chapter-header { display: flex; align-items: center; margin-bottom: 20px; gap: 15px; }
.chapter-num { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 5px; font-weight: bold; }
.chapter-title { font-family: var(--font-serif); font-size: 24px; font-weight: 600; }
.chapter-body { font-size: 16px; line-height: 1.8; color: var(--text-secondary); }
.chapter-body h4 { color: var(--text-primary); margin: 25px 0 10px; text-transform: uppercase; font-size: 14px; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 5px;}
.chapter-body p { margin-bottom: 15px; }
.chapter-body ul { padding-left: 25px; margin-bottom: 15px; }

.hidden { display: none !important; }
#welcome { padding: 60px; text-align: center; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
.course-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; transition: 0.2s; text-align: left; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
.course-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-header">
    <div class="brand-title">MBA Review</div>
    <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Comprehensive Academic Hub</div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search frameworks, cases..." />
  </div>
  <div id="sidebarNav"></div>
</nav>

<main id="main">
  <div id="topbar">
    <div style="font-size: 13px; color: var(--text-muted);">Library › <span id="currentLoc" style="color:var(--text-primary); font-weight: 500;">Home</span></div>
    <button class="theme-toggle" id="themeBtn">🌓 Toggle Theme</button>
  </div>

  <div id="welcome">
    <h1 style="font-family: var(--font-serif); font-size: 42px;">Academic Reference Hub</h1>
    <p style="color: var(--text-secondary); margin-top: 10px; max-width: 600px; margin-left: auto; margin-right: auto;">Select a module to review core textbook theories, critical formulas, and classic case studies from your MBA curriculum.</p>
    <div class="course-grid" id="courseGrid"></div>
  </div>

  <div id="readingPane" class="hidden"></div>
</main>

<script>window.wikiData = [];</script>

<script src="ecn500.js"></script>
<script src="fin500.js"></script>
<script src="mgt510.js"></script>
<script src="mgt520.js"></script>
<script src="mgt560.js"></script>
<script src="act500.js"></script>
<script src="mgt521.js"></script>
<script src="mgt530.js"></script>
<script src="ecom500.js"></script>
<script src="mgt672.js"></script>
<script src="pmp.js"></script>

<script>
window.onload = () => {
  const sidebar = document.getElementById('sidebarNav');
  const main = document.getElementById('main');
  const welcome = document.getElementById('welcome');
  const pane = document.getElementById('readingPane');
  const grid = document.getElementById('courseGrid');
  const search = document.getElementById('searchInput');

  function renderCourse(id) {
    const c = window.wikiData.find(x => x.id === id);
    if(!c) return;
    
    welcome.classList.add('hidden');
    pane.classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
    document.getElementById('currentLoc').innerText = c.tag;
    
    let html = `<div class="course-header"><span class="course-tag">${c.tag}</span><h1 class="course-title">${c.title}</h1><p class="course-desc">${c.description}</p></div>`;
    
    c.chapters.forEach((ch, i) => {
      let bodyContent = "";
      
      // Render case study arrays beautifully
      if (Array.isArray(ch.content) && ch.type === "cases") {
        bodyContent = ch.content.map(cs => `
          <div class="case-block" style="background: var(--bg-hover); padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); margin-bottom: 20px;">
            <span style="font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: bold;">${cs.tag}</span>
            <h3 style="margin: 5px 0 10px; font-family: var(--font-serif); color: var(--text-primary);">${cs.title}</h3>
            ${cs.body}
          </div>
        `).join('');
      } else {
        // Render standard text/HTML content
        bodyContent = ch.content;
      }

      // Automatically strip "Chapter X: " from the title
      let cleanTitle = ch.title.replace(/Chapter \d+:\s*/i, '');

      // Change the numerical badge to "MODULE 0X"
      html += `<div class="chapter"><div class="chapter-header"><span class="chapter-num" style="text-transform: uppercase;">Module 0${i+1}</span><h2 class="chapter-title">${cleanTitle}</h2></div><div class="chapter-body">${bodyContent}</div></div>`;
    });
    
    pane.innerHTML = html;
    main.scrollTop = 0;
  }

  // Ensure data loaded, then build navigation
  if(window.wikiData.length > 0) {
    window.wikiData.forEach(c => {
      // Build Sidebar Item
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.dataset.id = c.id;
      item.innerHTML = `<span>${c.title}</span> <span class="nav-badge">${c.tag}</span>`;
      item.onclick = () => renderCourse(c.id);
      sidebar.appendChild(item);
      
      // Build Grid Card
      const card = document.createElement('div');
      card.className = 'course-card';
      card.innerHTML = `<span style="font-family:var(--font-mono); font-size:10px; color:var(--accent); font-weight:bold;">${c.tag}</span><h3 style="font-size:15px; margin:8px 0 4px; color:var(--text-primary); line-height: 1.4;">${c.title}</h3>`;
      card.onclick = () => renderCourse(c.id);
      grid.appendChild(card);
    });
  } else {
    grid.innerHTML = `<p style="color:red; grid-column: 1 / -1; font-weight: bold;">Error: Course data not loaded. Ensure all 11 .js files are in the same folder as index.html.</p>`;
  }

  // Search Functionality
  search.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.nav-item').forEach(el => {
      const isMatch = el.innerText.toLowerCase().includes(q);
      el.style.display = isMatch ? 'flex' : 'none';
    });
  });

  // Dark Mode Toggle
  document.getElementById('themeBtn').onclick = () => {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  };
};
</script>
</body>
</html>
