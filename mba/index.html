<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MBA Executive Knowledge Hub</title>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ============ Tokens ============ */
:root {
  --bg: #F7F5F0;
  --bg-sidebar: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-hover: #F0EDE6;
  --bg-active: #1a3a5f;
  --text-primary: #1A1A2E;
  --text-secondary: #5C5C72;
  --text-muted: #9898A8;
  --text-on-active: #FFFFFF;
  --accent: #1a5f7a;
  --accent-soft: #e1edf2;
  --accent-warm: #b5552f;
  --border: #E4E0D8;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(20,20,30,0.06);
  --shadow-md: 0 8px 24px rgba(20,20,30,0.08);
  --font-serif: 'Lora', serif;
  --font-sans: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}
[data-theme="dark"] {
  --bg: #111118;
  --bg-sidebar: #18181F;
  --bg-card: #1E1E28;
  --bg-hover: #26263A;
  --bg-active: #4e9fb8;
  --text-primary: #EEEEF5;
  --text-secondary: #A0A0B8;
  --text-muted: #60607A;
  --text-on-active: #111118;
  --accent: #5cbcd9;
  --accent-soft: #1d2c33;
  --accent-warm: #d9824e;
  --border: #2A2A38;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  transition: background 0.25s, color 0.25s;
  -webkit-font-smoothing: antialiased;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

/* ============ Sidebar ============ */
#sidebar {
  width: 300px; min-width: 300px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 50;
}
.sidebar-header { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--bg-active));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-weight: 700; color: #fff; font-size: 16px;
  flex-shrink: 0;
}
.brand-title { font-family: var(--font-serif); font-size: 18px; font-weight: 700; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.3px; }
.sidebar-close-btn { display: none; font-size: 20px; color: var(--text-muted); padding: 4px; }

.search-box { padding: 14px 15px; border-bottom: 1px solid var(--border); position: relative; }
.search-box svg { position: absolute; left: 27px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none; }
#searchInput {
  width: 100%; padding: 10px 12px 10px 34px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-primary);
  font-size: 14px; outline: none; transition: border-color 0.2s;
}
#searchInput:focus { border-color: var(--accent); }
.search-kbd {
  position: absolute; right: 23px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
  pointer-events: none;
}

#sidebarNav { flex: 1; overflow-y: auto; padding: 10px 0 16px; }
.nav-group-label {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-muted); padding: 16px 20px 6px;
}
.nav-item {
  padding: 10px 20px; font-size: 13.5px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 10px; transition: 0.15s; cursor: pointer;
  position: relative; line-height: 1.3;
}
.nav-item .nav-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0;
  transition: 0.2s;
}
.nav-item.visited .nav-dot { background: var(--accent-warm); }
.nav-item .nav-label { flex: 1; }
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--bg-active); color: var(--text-on-active); }
.nav-item.active .nav-dot { background: var(--text-on-active); opacity: 0.6; }
.nav-badge { font-size: 9.5px; font-family: var(--font-mono); background: var(--accent-soft); color: var(--accent); padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.nav-item.active .nav-badge { background: rgba(255,255,255,0.18); color: var(--text-on-active); }
.nav-empty { padding: 20px; font-size: 13px; color: var(--text-muted); text-align: center; }

.sidebar-footer { padding: 14px 20px; border-top: 1px solid var(--border); }
.progress-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-mono); }
.progress-track { height: 5px; border-radius: 4px; background: var(--bg-hover); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent-warm); border-radius: 4px; transition: width 0.4s ease; }

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,15,0.5); z-index: 40; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(1px); }

/* ============ Main ============ */
#main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; scroll-behavior: smooth; }
#topbar {
  padding: 0 40px; height: 60px; display: flex; align-items: center; justify-content: space-between;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
}
.crumb { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumb span#currentLoc { color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
.icon-btn { font-size: 18px; color: var(--text-primary); padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn:hover { background: var(--bg-hover); }
.mobile-menu-btn, .mobile-search-btn { display: none; }
.theme-toggle {
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px;
  font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--text-primary); }

#readingPane { padding: 40px 60px 100px; max-width: 880px; margin: 0 auto; width: 100%; animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.course-header { margin-bottom: 28px; }
.course-tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.course-title { font-family: var(--font-serif); font-size: 34px; font-weight: 700; margin: 10px 0; line-height: 1.15; }
.course-desc { color: var(--text-secondary); font-size: 16px; line-height: 1.6; }
.course-meta { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); flex-wrap: wrap; }
.course-meta span { display: flex; align-items: center; gap: 5px; }

/* In-page chapter quick nav */
.toc-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
.toc-pill {
  font-size: 12px; padding: 6px 12px; border-radius: 20px; background: var(--bg-card);
  border: 1px solid var(--border); color: var(--text-secondary); transition: 0.15s; white-space: nowrap;
}
.toc-pill:hover { border-color: var(--accent); color: var(--accent); }

.chapter { margin-bottom: 52px; scroll-margin-top: 80px; }
.chapter-header { display: flex; align-items: center; margin-bottom: 18px; gap: 14px; flex-wrap: wrap; }
.chapter-num { font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 5px; font-weight: bold; letter-spacing: 0.5px; }
.chapter-title { font-family: var(--font-serif); font-size: 23px; font-weight: 600; line-height: 1.25; }
.chapter-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-left: auto; flex-shrink: 0; }
.chapter-body { font-size: 16px; line-height: 1.8; color: var(--text-secondary); }
.chapter-body h4 { color: var(--text-primary); margin: 26px 0 10px; text-transform: uppercase; font-size: 13px; letter-spacing: 0.6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-weight: 600; }
.chapter-body p { margin-bottom: 15px; }
.chapter-body ul, .chapter-body ol { padding-left: 24px; margin-bottom: 15px; }
.chapter-body li { margin-bottom: 6px; }
.chapter-body strong { color: var(--text-primary); }

.chapter-nav-footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 50px; padding-top: 24px; border-top: 1px solid var(--border); }
.chapter-nav-btn {
  flex: 1; max-width: 48%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
  text-align: left; transition: 0.18s; background: var(--bg-card);
}
.chapter-nav-btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.chapter-nav-btn.next { text-align: right; margin-left: auto; }
.chapter-nav-label { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
.chapter-nav-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }

.hidden { display: none !important; }

#welcome { padding: 50px 60px 80px; max-width: 1080px; margin: 0 auto; width: 100%; }
.welcome-hero { text-align: center; max-width: 640px; margin: 0 auto 10px; }
.welcome-eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }
#welcome h1 { font-family: var(--font-serif); font-size: 40px; margin: 10px 0 12px; line-height: 1.15; }
#welcome .lede { color: var(--text-secondary); font-size: 16px; line-height: 1.6; }

.continue-card {
  margin: 28px auto 0; max-width: 480px; display: flex; align-items: center; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px 18px; box-shadow: var(--shadow-sm); text-align: left; transition: 0.18s;
}
.continue-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.continue-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.continue-text { flex: 1; min-width: 0; }
.continue-text .label { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; }
.continue-text .title { font-size: 14px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue-arrow { color: var(--text-muted); font-size: 18px; flex-shrink: 0; }

.section-row { display: flex; align-items: baseline; justify-content: space-between; margin: 44px 0 18px; }
.section-row h2 { font-family: var(--font-serif); font-size: 20px; }
.section-row .stat { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.course-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 22px; transition: 0.2s; text-align: left; cursor: pointer; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 10px; position: relative;
}
.course-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.course-card .ccard-top { display: flex; align-items: center; justify-content: space-between; }
.course-card .ccard-tag { font-family: var(--font-mono); font-size: 10px; color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }
.course-card .ccard-check { font-size: 12px; color: var(--accent-warm); }
.course-card h3 { font-size: 15px; color: var(--text-primary); line-height: 1.4; font-weight: 600; }
.course-card .ccard-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.no-results { text-align: center; padding: 50px 20px; color: var(--text-muted); grid-column: 1 / -1; }

/* Footer */
.site-footer {
  margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
}
.site-footer .footer-name { font-family: var(--font-serif); font-size: 14px; color: var(--text-primary); font-weight: 600; }
.site-footer .footer-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }
.footer-links { display: flex; gap: 10px; flex-wrap: wrap; }
.footer-links a {
  display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary);
  text-decoration: none; padding: 7px 13px; border: 1px solid var(--border); border-radius: 20px;
  transition: 0.18s; background: var(--bg-card);
}
.footer-links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.footer-links svg { width: 14px; height: 14px; flex-shrink: 0; }
@media (max-width: 768px) {
  .site-footer { flex-direction: column; align-items: flex-start; margin-top: 40px; }
}

/* Back to top */
#toTopBtn {
  position: fixed; right: 26px; bottom: 26px; width: 42px; height: 42px; border-radius: 50%;
  background: var(--bg-active); color: var(--text-on-active); display: flex; align-items: center; justify-content: center;
  font-size: 16px; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: 0.25s; z-index: 30;
}
#toTopBtn.visible { opacity: 1; pointer-events: auto; }

/* ============ Mobile ============ */
@media (max-width: 768px) {
  .mobile-menu-btn { display: flex; }
  .mobile-search-btn { display: flex; }
  .sidebar-close-btn { display: block; }

  #sidebar {
    position: fixed; top: 0; left: -320px; height: 100vh; height: 100dvh;
    transition: left 0.28s ease; box-shadow: 2px 0 20px rgba(0,0,0,0.25); width: 86%; max-width: 320px;
  }
  #sidebar.open { left: 0; }
  .sidebar-overlay.active { display: block; opacity: 1; }

  #topbar { padding: 0 14px; }
  .crumb { font-size: 12px; }
  #welcome { padding: 30px 18px 60px; }
  #welcome h1 { font-size: 28px; }
  .welcome-hero { max-width: 100%; }
  #readingPane { padding: 24px 18px 90px; }
  .course-title { font-size: 26px; }
  .course-grid { grid-template-columns: 1fr; }
  .chapter-title { font-size: 19px; }
  .chapter-time { margin-left: 0; flex-basis: 100%; }
  .chapter-nav-footer { flex-direction: column; }
  .chapter-nav-btn { max-width: 100%; }
  .chapter-nav-btn.next { text-align: left; }
  #toTopBtn { right: 16px; bottom: 16px; }
  .toc-bar { padding-bottom: 20px; margin-bottom: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-title">MBA Review</div>
        <div class="brand-sub">Academic Knowledge Hub</div>
      </div>
    </div>
    <button class="sidebar-close-btn" id="closeBtn" aria-label="Close menu">✕</button>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search modules, cases, frameworks..." />
    <span class="search-kbd">/</span>
  </div>
  <div id="sidebarNav"></div>
  <div class="sidebar-footer">
    <div class="progress-row"><span id="progressLabel">0 / 0 reviewed</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main id="main">
  <div id="topbar">
    <div class="topbar-left">
      <button class="icon-btn mobile-menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="crumb">Library <span>›</span> <span id="currentLoc">Home</span></div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn mobile-search-btn" id="mobileSearchBtn" aria-label="Search">🔎</button>
      <button class="theme-toggle" id="themeBtn"><span id="themeIcon">🌙</span><span id="themeText">Dark</span></button>
    </div>
  </div>

  <div id="welcome">
    <div class="welcome-hero">
      <div class="welcome-eyebrow">11 Modules · Curated Reviews</div>
      <h1>Academic Reference Hub</h1>
      <p class="lede">Core textbook theories, critical formulas, and classic case studies from your MBA curriculum — organized for fast review, anywhere.</p>
    </div>
    <div id="continueWrap"></div>

    <div class="section-row">
      <h2>All modules</h2>
      <span class="stat" id="gridStat"></span>
    </div>
    <div class="course-grid" id="courseGrid"></div>
    <div id="homeFooter"></div>
  </div>

  <div id="readingPane" class="hidden"></div>
</main>

<button id="toTopBtn" aria-label="Back to top">↑</button>

<script>window.wikiData = [];</script>

<script src="ecn500.js"></script>
<script src="fin500.js"></script>
<script src="mgt510.js"></script>
<script src="mgt520.js"></script>
<script src="mgt560.js"></script>
<script src="act500.js"></script>
<script src="mgt521.js"></script>
<script src="mgt530.js"></script>
<script src="ecom500.js"></script>
<script src="mgt672.js"></script>
<script src="pmp.js"></script>

<script>
window.onload = () => {
  const sidebarContainer = document.getElementById('sidebar');
  const sidebarNav = document.getElementById('sidebarNav');
  const main = document.getElementById('main');
  const welcome = document.getElementById('welcome');
  const pane = document.getElementById('readingPane');
  const grid = document.getElementById('courseGrid');
  const gridStat = document.getElementById('gridStat');
  const search = document.getElementById('searchInput');
  const menuBtn = document.getElementById('menuBtn');
  const closeBtn = document.getElementById('closeBtn');
  const mobileSearchBtn = document.getElementById('mobileSearchBtn');
  const overlay = document.getElementById('sidebarOverlay');
  const toTopBtn = document.getElementById('toTopBtn');
  const continueWrap = document.getElementById('continueWrap');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct = document.getElementById('progressPct');
  const progressFill = document.getElementById('progressFill');

  const STORAGE_VISITED = 'mba_visited_v1';
  const STORAGE_LAST = 'mba_last_v1';
  const STORAGE_THEME = 'mba_theme_v1';

  // ---- Group definitions (purely organizational; falls back gracefully if ids change) ----
  const GROUPS = [
    { label: 'Strategy & Leadership', ids: ['mgt510', 'mgt560', 'mgt521', 'mgt520'] },
    { label: 'Finance & Accounting', ids: ['fin500', 'act500'] },
    { label: 'Operations & Technology', ids: ['mgt530', 'ecom500'] },
    { label: 'Global & Project Management', ids: ['ecn500', 'mgt672', 'pmp'] }
  ];

  function getVisited() {
    try { return JSON.parse(localStorage.getItem(STORAGE_VISITED)) || []; } catch (e) { return []; }
  }
  function markVisited(id) {
    const v = getVisited();
    if (!v.includes(id)) { v.push(id); localStorage.setItem(STORAGE_VISITED, JSON.stringify(v)); }
    updateProgressUI();
  }
  function updateProgressUI() {
    const visited = getVisited();
    const total = window.wikiData.length || 1;
    const count = visited.filter(id => window.wikiData.some(c => c.id === id)).length;
    const pct = Math.round((count / total) * 100);
    progressLabel.textContent = `${count} / ${total} reviewed`;
    progressPct.textContent = `${pct}%`;
    progressFill.style.width = pct + '%';
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('visited', visited.includes(el.dataset.id));
    });
    document.querySelectorAll('.course-card').forEach(el => {
      const check = el.querySelector('.ccard-check');
      if (check) check.classList.toggle('hidden', !visited.includes(el.dataset.id));
    });
  }

  function estimateReadTime(html) {
    const text = (html || '').replace(/<[^>]+>/g, ' ');
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 200));
  }

  function footerHTML() {
    return `
      <div class="site-footer">
        <div>
          <div class="footer-name">Khalid Nasban</div>
          <div class="footer-sub">MBA Review Hub</div>
        </div>
        <div class="footer-links">
          <a href="mailto:KNasban@gmail.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
            KNasban@gmail.com
          </a>
          <a href="https://linkedin.com/in/khalid-Nasban" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/><path d="M10 9v12M10 13a4 4 0 0 1 8 0v8"/></svg>
            LinkedIn
          </a>
          <a href="https://binnasban.com" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
            binnasban.com
          </a>
        </div>
      </div>`;
  }

  function toggleMobileMenu(forceOpen) {
    const open = forceOpen !== undefined ? forceOpen : !sidebarContainer.classList.contains('open');
    sidebarContainer.classList.toggle('open', open);
    overlay.classList.toggle('active', open);
    document.body.style.overflow = open ? 'hidden' : '';
  }
  menuBtn.onclick = () => toggleMobileMenu(true);
  closeBtn.onclick = () => toggleMobileMenu(false);
  overlay.onclick = () => toggleMobileMenu(false);
  mobileSearchBtn.onclick = () => { toggleMobileMenu(true); setTimeout(() => search.focus(), 320); };

  // ---- Theme ----
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
    document.getElementById('themeText').textContent = theme === 'dark' ? 'Light' : 'Dark';
    localStorage.setItem(STORAGE_THEME, theme);
  }
  const savedTheme = localStorage.getItem(STORAGE_THEME) ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);
  document.getElementById('themeBtn').onclick = () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  };

  function renderCourse(id, opts) {
    opts = opts || {};
    const idx = window.wikiData.findIndex(x => x.id === id);
    if (idx === -1) return;
    const c = window.wikiData[idx];

    welcome.classList.add('hidden');
    pane.classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
    document.getElementById('currentLoc').textContent = c.tag;

    const totalMinutes = c.chapters.reduce((sum, ch) => {
      const html = Array.isArray(ch.content) ? ch.content.map(cs => cs.body).join(' ') : ch.content;
      return sum + estimateReadTime(html);
    }, 0);

    let html = `<div class="course-header">
      <span class="course-tag">${c.tag}</span>
      <h1 class="course-title">${c.title}</h1>
      <p class="course-desc">${c.description}</p>
      <div class="course-meta">
        <span>📖 ${c.chapters.length} sections</span>
        <span>⏱ ~${totalMinutes} min read</span>
      </div>
    </div>`;

    html += `<div class="toc-bar">` + c.chapters.map((ch, i) => {
      const cleanTitle = ch.title.replace(/Chapter \d+:\s*/i, '').replace(/Module \d+:\s*/i, '');
      return `<button class="toc-pill" data-jump="chapter-${id}-${i}">${i + 1}. ${cleanTitle}</button>`;
    }).join('') + `</div>`;

    c.chapters.forEach((ch, i) => {
      let bodyContent = "";
      const readMin = Array.isArray(ch.content) && ch.type === 'cases'
        ? estimateReadTime(ch.content.map(cs => cs.body).join(' '))
        : estimateReadTime(ch.content);

      if (Array.isArray(ch.content) && ch.type === "cases") {
        bodyContent = ch.content.map(cs => `
          <div class="case-block" style="background: var(--bg-hover); padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); margin-bottom: 20px;">
            <span style="font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: bold;">${cs.tag}</span>
            <h3 style="margin: 5px 0 10px; font-family: var(--font-serif); color: var(--text-primary);">${cs.title}</h3>
            ${cs.body}
          </div>
        `).join('');
      } else {
        bodyContent = ch.content;
      }

      const cleanTitle = ch.title.replace(/Chapter \d+:\s*/i, '').replace(/Module \d+:\s*/i, '');

      html += `<div class="chapter" id="chapter-${id}-${i}">
        <div class="chapter-header">
          <span class="chapter-num">Module 0${i + 1}</span>
          <h2 class="chapter-title">${cleanTitle}</h2>
          <span class="chapter-time">${readMin} min read</span>
        </div>
        <div class="chapter-body">${bodyContent}</div>
      </div>`;
    });

    // Prev/Next course navigation
    const prevC = window.wikiData[idx - 1];
    const nextC = window.wikiData[idx + 1];
    html += `<div class="chapter-nav-footer">`;
    html += prevC
      ? `<button class="chapter-nav-btn prev" data-go="${prevC.id}"><span class="chapter-nav-label">← Previous</span><span class="chapter-nav-title">${prevC.tag}: ${prevC.title.split(':').pop().trim()}</span></button>`
      : `<div></div>`;
    html += nextC
      ? `<button class="chapter-nav-btn next" data-go="${nextC.id}"><span class="chapter-nav-label">Next →</span><span class="chapter-nav-title">${nextC.tag}: ${nextC.title.split(':').pop().trim()}</span></button>`
      : `<div></div>`;
    html += `</div>`;

    html += footerHTML();

    pane.innerHTML = html;
    main.scrollTop = 0;

    pane.querySelectorAll('[data-jump]').forEach(btn => {
      btn.onclick = () => {
        const el = document.getElementById(btn.dataset.jump);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
    pane.querySelectorAll('[data-go]').forEach(btn => {
      btn.onclick = () => renderCourse(btn.dataset.go);
    });

    markVisited(id);
    localStorage.setItem(STORAGE_LAST, id);
    renderContinueCard();

    if (window.innerWidth <= 768) toggleMobileMenu(false);
  }

  function renderHome() {
    welcome.classList.remove('hidden');
    pane.classList.add('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('currentLoc').textContent = 'Home';
    if (window.innerWidth <= 768) toggleMobileMenu(false);
    main.scrollTop = 0;
  }

  function renderContinueCard() {
    const lastId = localStorage.getItem(STORAGE_LAST);
    const c = window.wikiData.find(x => x.id === lastId);
    if (!c) { continueWrap.innerHTML = ''; return; }
    continueWrap.innerHTML = `
      <div class="continue-card" id="continueCard">
        <div class="continue-icon">↻</div>
        <div class="continue-text">
          <div class="label">Continue reviewing</div>
          <div class="title">${c.tag} — ${c.title.split(':').pop().trim()}</div>
        </div>
        <div class="continue-arrow">→</div>
      </div>`;
    document.getElementById('continueCard').onclick = () => renderCourse(c.id);
  }

  function buildSidebarAndGrid() {
    if (window.wikiData.length === 0) {
      sidebarNav.innerHTML = `<div class="nav-empty">No course data loaded. Ensure all .js files sit alongside index.html.</div>`;
      grid.innerHTML = `<p style="color:#b5552f; grid-column: 1 / -1; font-weight: bold;">Error: Course data not loaded. Ensure all 11 .js files are in the same folder as index.html.</p>`;
      return;
    }

    const byId = {};
    window.wikiData.forEach(c => byId[c.id] = c);
    const grouped = new Set();

    function buildNavItem(c) {
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.dataset.id = c.id;
      item.innerHTML = `<span class="nav-dot"></span><span class="nav-label">${c.title}</span><span class="nav-badge">${c.tag}</span>`;
      item.onclick = () => renderCourse(c.id);
      return item;
    }

    GROUPS.forEach(group => {
      const items = group.ids.map(id => byId[id]).filter(Boolean);
      if (!items.length) return;
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = group.label;
      sidebarNav.appendChild(label);
      items.forEach(c => { sidebarNav.appendChild(buildNavItem(c)); grouped.add(c.id); });
    });

    const rest = window.wikiData.filter(c => !grouped.has(c.id));
    if (rest.length) {
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = 'More Modules';
      sidebarNav.appendChild(label);
      rest.forEach(c => sidebarNav.appendChild(buildNavItem(c)));
    }

    // Grid cards (follow same overall order as wikiData for predictability)
    window.wikiData.forEach(c => {
      const card = document.createElement('div');
      card.className = 'course-card';
      card.dataset.id = c.id;
      card.innerHTML = `
        <div class="ccard-top">
          <span class="ccard-tag">${c.tag}</span>
          <span class="ccard-check hidden">✓ reviewed</span>
        </div>
        <h3>${c.title}</h3>
        <p class="ccard-desc">${c.description}</p>`;
      card.onclick = () => renderCourse(c.id);
      grid.appendChild(card);
    });

    gridStat.textContent = `${window.wikiData.length} total`;
    updateProgressUI();
    renderContinueCard();
  }

  buildSidebarAndGrid();
  document.getElementById('homeFooter').innerHTML = footerHTML();

  // ---- Search (filters nav items + grid cards; searches title, tag, description) ----
  function applySearch(q) {
    q = q.trim().toLowerCase();
    let navVisible = 0;
    document.querySelectorAll('.nav-group-label').forEach(l => l.style.display = '');
    document.querySelectorAll('.nav-item').forEach(el => {
      const hay = el.innerText.toLowerCase();
      const match = !q || hay.includes(q);
      el.style.display = match ? 'flex' : 'none';
      if (match) navVisible++;
    });
    // Hide empty group labels
    document.querySelectorAll('.nav-group-label').forEach(label => {
      let sib = label.nextElementSibling;
      let any = false;
      while (sib && sib.classList.contains('nav-item')) {
        if (sib.style.display !== 'none') any = true;
        sib = sib.nextElementSibling;
      }
      label.style.display = any ? '' : 'none';
    });

    let gridVisible = 0;
    document.querySelectorAll('.course-card').forEach(el => {
      const hay = el.innerText.toLowerCase();
      const match = !q || hay.includes(q);
      el.style.display = match ? '' : 'none';
      if (match) gridVisible++;
    });
    const existingNoResults = grid.querySelector('.no-results');
    if (existingNoResults) existingNoResults.remove();
    if (q && gridVisible === 0) {
      const div = document.createElement('div');
      div.className = 'no-results';
      div.textContent = `No modules match "${q}".`;
      grid.appendChild(div);
    }
  }
  search.addEventListener('input', e => applySearch(e.target.value));

  // ---- Keyboard shortcuts ----
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search) {
      e.preventDefault();
      if (window.innerWidth <= 768) toggleMobileMenu(true);
      search.focus();
    }
    if (e.key === 'Escape') {
      if (document.activeElement === search) search.blur();
      if (sidebarContainer.classList.contains('open')) toggleMobileMenu(false);
    }
  });

  // ---- Back to top ----
  main.addEventListener('scroll', () => {
    toTopBtn.classList.toggle('visible', main.scrollTop > 480);
  });
  toTopBtn.onclick = () => main.scrollTo({ top: 0, behavior: 'smooth' });

  // ---- Brand click -> home ----
  document.querySelector('.brand').style.cursor = 'pointer';
  document.querySelector('.brand').onclick = renderHome;
};
</script>
</body>
</html>
